<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealSplit TH - ระบบหารค่าข้าว</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel สำหรับคอมไพล์ JSX ในเบราว์เซอร์ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (Compat version สำหรับรันบนไฟล์ HTML ตรงๆ) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <!-- QR Code Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

  <style> body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 1. ตั้งค่า Firebase เชื่อมต่อกับโปรเจกต์ใหม่
    const firebaseConfig = {
      projectId: "mealsplit-th",
      appId: "1:575865319667:web:df3d76a11f4f944656c786",
      apiKey: "AIzaSyDDPQOrGwIj7ggnzGpDfiNW612fVLGt0HU",
      authDomain: "mealsplit-th.firebaseapp.com",
      storageBucket: "mealsplit-th.firebasestorage.app",
      messagingSenderId: "575865319667",
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. ฟังก์ชันสร้าง Payload สำหรับพร้อมเพย์แบบไม่ต้องพึ่ง npm
    function generatePromptPayPayload(target, amount) {
      target = target.replace(/[^0-9]/g, '');
      if (!target) return "";
      
      const targetType = target.length >= 15 ? '03' : target.length >= 13 ? '02' : '01';
      const formattedTarget = target.length >= 13 ? target : ("0000000000000" + target.replace(/^0/, "66")).slice(-13);
      
      let data = [
        "000201", "010211", "29370016A000000677010111", targetType, 
        formattedTarget.length.toString().padStart(2, '0'), formattedTarget,
        "5802TH", "5303764"
      ];
      
      if (amount && amount > 0) {
        const amtStr = amount.toFixed(2);
        data.push("54" + amtStr.length.toString().padStart(2, '0') + amtStr);
      }
      data.push("6304");
      
      let payload = data.join("");
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    // 3. คอมโพเนนต์แสดงรูป QR Code
    function PromptPayQR({ promptPay, amount }) {
      const [src, setSrc] = useState('');
      
      useEffect(() => {
        const payload = generatePromptPayPayload(promptPay, amount);
        if (payload) {
          QRCode.toDataURL(payload, { margin: 2, scale: 5, color: { dark: '#0f172a', light: '#ffffff' } }, (err, url) => {
            if (!err) setSrc(url);
          });
        }
      }, [promptPay, amount]);

      if (!src) return <div className="text-xs text-amber-500 bg-amber-50 p-2 rounded text-center">ไม่พบเลขพร้อมเพย์ที่ถูกต้อง</div>;
      return <img src={src} alt="PromptPay QR" className="w-32 h-32 mx-auto rounded-lg border border-slate-200" />;
    }

    // 4. คอมโพเนนต์หลักของแอป
    function App() {
      const [activeTab, setActiveTab] = useState('meals');
      const [friends, setFriends] = useState([]);
      const [meals, setMeals] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      // ดึงข้อมูล Realtime จาก Firestore
      useEffect(() => {
        const unsubFriends = db.collection('friends').orderBy('createdAt', 'asc').onSnapshot(snap => {
          setFriends(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubMeals = db.collection('meals').orderBy('createdAt', 'desc').onSnapshot(snap => {
          setMeals(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          setIsLoading(false);
        });

        return () => { unsubFriends(); unsubMeals(); };
      }, []);

      // จัดการเพื่อน
      const handleAddFriend = async (e) => {
        e.preventDefault();
        const name = e.target.name.value.trim();
        const promptPay = e.target.promptPay.value.trim();
        if (name) {
          const colors = ['indigo','emerald','rose','amber','purple','cyan','teal'];
          const color = `bg-${colors[friends.length % colors.length]}-500`;
          await db.collection('friends').add({ name, promptPay, color, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          e.target.reset();
        }
      };

      const deleteFriend = async (id) => {
        if(confirm('ลบเพื่อนคนนี้?')) await db.collection('friends').doc(id).delete();
      };

      // จัดการมื้ออาหาร
      const handleAddMeal = async (e) => {
        e.preventDefault();
        const title = e.target.title.value.trim();
        const amount = parseFloat(e.target.amount.value);
        const payerId = e.target.payerId.value;
        const participantIds = Array.from(e.target.participants).filter(cb => cb.checked).map(cb => cb.value);
        
        if (title && amount && payerId && participantIds.length > 0) {
          await db.collection('meals').add({
            title, amount, payerId, participantIds, 
            date: new Date().toLocaleDateString('th-TH'),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          e.target.reset();
        } else {
          alert('กรุณากรอกข้อมูลให้ครบ และเลือกผู้ร่วมหารอย่างน้อย 1 คน');
        }
      };

      const deleteMeal = async (id) => {
        if(confirm('ลบบิลมื้อนี้?')) await db.collection('meals').doc(id).delete();
      };

      // อัลกอริทึมคำนวณหักลบหนี้
      const settlement = useMemo(() => {
        const balances = {};
        friends.forEach(f => balances[f.id] = { ...f, net: 0, totalPaid: 0, totalOwed: 0 });
        
        let totalExpense = 0;
        meals.forEach(m => {
          totalExpense += m.amount;
          if(balances[m.payerId]) {
            balances[m.payerId].net += Number(m.amount);
            balances[m.payerId].totalPaid += Number(m.amount);
          }
          const splitAmount = Number(m.amount) / m.participantIds.length;
          m.participantIds.forEach(pid => {
            if(balances[pid]) {
              balances[pid].net -= splitAmount;
              balances[pid].totalOwed += splitAmount;
            }
          });
        });

        let debtors = [];
        let creditors = [];
        Object.values(balances).forEach(b => {
          if (b.net < -0.01) debtors.push({ ...b, amount: Math.abs(b.net) });
          else if (b.net > 0.01) creditors.push({ ...b, amount: b.net });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transfers = [];
        let d = 0, c = 0;
        while (d < debtors.length && c < creditors.length) {
          const debtor = debtors[d];
          const creditor = creditors[c];
          const min = Math.min(debtor.amount, creditor.amount);
          
          if (min > 0.01) {
            transfers.push({
              from: debtor.name, to: creditor.name,
              amount: min, promptPay: creditor.promptPay
            });
          }

          debtor.amount -= min;
          creditor.amount -= min;
          if (debtor.amount < 0.01) d++;
          if (creditor.amount < 0.01) c++;
        }
        return { totalExpense, transfers, balances };
      }, [friends, meals]);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold">กำลังเชื่อมต่อฐานข้อมูล Realtime...</div>;

      return (
        <div className="max-w-xl mx-auto min-h-screen flex flex-col sm:py-6">
          <div className="bg-white sm:rounded-3xl shadow-xl overflow-hidden flex-1 border border-slate-200">
            {/* ส่วนหัวของแอป */}
            <div className="bg-indigo-600 p-6 text-white text-center">
              <h1 className="text-2xl font-bold tracking-tight">MealSplit TH 🍽️</h1>
              <p className="text-indigo-200 text-sm mt-1">ระบบหารค่าข้าว & หักลบหนี้เรียลไทม์</p>
              <div className="mt-2 inline-block bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">
                Online - ซิงค์ข้อมูลข้ามเครื่องอัตโนมัติ
              </div>
            </div>

            {/* แถบเมนู */}
            <div className="flex border-b border-slate-200 bg-slate-50">
              <button onClick={() => setActiveTab('meals')} className={`flex-1 py-3 text-sm font-semibold transition-colors ${activeTab === 'meals' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-700'}`}>บิลอาหาร ({meals.length})</button>
              <button onClick={() => setActiveTab('friends')} className={`flex-1 py-3 text-sm font-semibold transition-colors ${activeTab === 'friends' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-700'}`}>เพื่อน ({friends.length})</button>
              <button onClick={() => setActiveTab('settle')} className={`flex-1 py-3 text-sm font-semibold transition-colors ${activeTab === 'settle' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-700'}`}>เคลียร์ยอด</button>
            </div>

            {/* พื้นที่แสดงเนื้อหาหลัก */}
            <div className="p-6">
              
              {/* แท็บ: จัดการเพื่อน */}
              {activeTab === 'friends' && (
                <div className="animate-fade-in">
                  <form onSubmit={handleAddFriend} className="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 space-y-3">
                    <h2 className="font-bold text-slate-700 text-sm">➕ เพิ่มเพื่อนใหม่ลงกลุ่ม</h2>
                    <input name="name" placeholder="ชื่อเพื่อน *" className="w-full p-2.5 rounded-lg border border-slate-300 text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" required />
                    <input name="promptPay" placeholder="เบอร์พร้อมเพย์ (Mobile / ID Card)" className="w-full p-2.5 rounded-lg border border-slate-300 text-sm font-mono outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
                    <button className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-indigo-700 transition shadow-sm">บันทึกชื่อเพื่อน</button>
                  </form>
                  <div className="space-y-2">
                    {friends.map(f => (
                      <div key={f.id} className="flex justify-between items-center p-3 border border-slate-200 bg-white rounded-xl shadow-sm">
                        <div className="flex items-center gap-3">
                          <div className={`w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-xs ${f.color || 'bg-slate-500'}`}>{f.name.charAt(0)}</div>
                          <div>
                            <p className="font-bold text-sm text-slate-800">{f.name}</p>
                            {f.promptPay && <p className="text-[11px] text-slate-500 font-mono">พร้อมเพย์: <span className="font-semibold text-slate-700">{f.promptPay}</span></p>}
                          </div>
                        </div>
                        <button onClick={() => deleteFriend(f.id)} className="text-rose-500 p-2 text-xs font-bold hover:bg-rose-50 rounded transition">ลบ</button>
                      </div>
                    ))}
                    {friends.length === 0 && <p className="text-center text-slate-400 text-sm py-4">ยังไม่มีรายชื่อเพื่อนในกลุ่มนี้</p>}
                  </div>
                </div>
              )}

              {/* แท็บ: บันทึกบิลค่าอาหาร */}
              {activeTab === 'meals' && (
                <div className="animate-fade-in">
                  <form onSubmit={handleAddMeal} className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6 space-y-3">
                    <h2 className="font-bold text-indigo-900 text-sm">📝 บันทึกมื้อใหม่</h2>
                    <input name="title" placeholder="ชื่อรายการ (เช่น ชาบูหม่าล่า) *" className="w-full p-2.5 rounded-lg border border-white text-sm outline-none shadow-sm focus:border-indigo-500" required />
                    <input name="amount" type="number" step="0.01" placeholder="ยอดรวมทั้งบิล (บาท) *" className="w-full p-2.5 rounded-lg border border-white text-sm outline-none shadow-sm focus:border-indigo-500" required />
                    
                    <div className="bg-white p-3 rounded-lg shadow-sm border border-slate-100">
                      <p className="text-xs font-bold text-slate-700 mb-2">💸 ใครเป็นคนสำรองจ่ายเงิน?</p>
                      <select name="payerId" className="w-full p-2 border border-slate-200 rounded-lg text-sm bg-slate-50 outline-none focus:border-indigo-500" required>
                        <option value="">-- เลือกคนจ่าย --</option>
                        {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                      </select>
                    </div>

                    <div className="bg-white p-3 rounded-lg shadow-sm border border-slate-100">
                      <p className="text-xs font-bold text-slate-700 mb-2">🍴 ใครร่วมกินมื้อนี้บ้าง? (หารเท่ากัน)</p>
                      <div className="grid grid-cols-2 gap-2">
                        {friends.map(f => (
                          <label key={f.id} className="flex items-center gap-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50 transition">
                            <input type="checkbox" name="participants" value={f.id} className="w-4 h-4 text-indigo-600 rounded" defaultChecked />
                            {f.name}
                          </label>
                        ))}
                      </div>
                    </div>
                    
                    <button disabled={friends.length === 0} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-indigo-700 transition shadow-sm disabled:opacity-50">
                      {friends.length === 0 ? 'กรุณาเพิ่มเพื่อนก่อนบันทึกบิล' : 'บันทึกบิลนี้ขึ้น Cloud'}
                    </button>
                  </form>

                  <div className="space-y-3">
                    <h3 className="font-bold text-slate-700 text-sm">ประวัติบิลในกลุ่ม</h3>
                    {meals.map(m => {
                      const payer = friends.find(f => f.id === m.payerId);
                      const parts = m.participantIds.map(id => friends.find(f=>f.id===id)?.name).filter(Boolean);
                      return (
                        <div key={m.id} className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm relative hover:border-indigo-300 transition">
                          <button onClick={() => deleteMeal(m.id)} className="absolute top-3 right-3 text-slate-300 hover:text-rose-500 transition text-xs font-bold">✕ ลบ</button>
                          <div className="flex justify-between items-start mb-2 pr-8">
                            <div>
                              <h4 className="font-bold text-slate-800">{m.title}</h4>
                              <p className="text-[11px] text-slate-400 mt-0.5">{m.date}</p>
                            </div>
                            <span className="font-mono font-bold text-lg text-rose-600">{m.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</span>
                          </div>
                          <div className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg mt-2 space-y-1.5 border border-slate-100">
                            <p className="flex justify-between"><span className="text-slate-400">คนจ่าย:</span> <strong className="text-emerald-600">{payer?.name || 'Unknown'}</strong></p>
                            <p className="flex justify-between"><span className="text-slate-400">คนกิน ({parts.length}):</span> <span className="text-right">{parts.join(', ')}</span></p>
                            <div className="pt-1.5 mt-1.5 border-t border-slate-200 flex justify-between">
                              <span className="text-slate-400 font-semibold">ตกคนละ:</span> 
                              <strong className="text-slate-700 font-mono">{(m.amount / m.participantIds.length).toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</strong>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                    {meals.length === 0 && <p className="text-center text-slate-400 text-sm py-4">ยังไม่มีประวัติการบันทึกมื้ออาหาร</p>}
                  </div>
                </div>
              )}

              {/* แท็บ: เคลียร์ยอดและสแกนพร้อมเพย์ */}
              {activeTab === 'settle' && (
                <div className="animate-fade-in">
                  <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl mb-6 text-center shadow-sm">
                    <span className="text-xs font-bold text-emerald-800 uppercase tracking-wider">ยอดรวมค่าอาหารทุกมื้อ</span>
                    <h2 className="text-3xl font-mono font-extrabold text-emerald-700 mt-1">{settlement.totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</h2>
                    <p className="text-[11px] text-emerald-600 mt-2 font-medium bg-emerald-100/50 py-1 px-2 rounded-lg inline-block">✨ หักลบหนี้ให้แล้ว โอนตามรายการด้านล่างนี้ได้เลย</p>
                  </div>
                  
                  <div className="space-y-3">
                    {settlement.transfers.length === 0 ? (
                      <div className="text-center py-10 bg-slate-50 rounded-xl border border-slate-200 shadow-sm">
                        <div className="text-4xl mb-3">🎉</div>
                        <p className="font-bold text-slate-800">เคลียร์ยอดครบถ้วน!</p>
                        <p className="text-xs text-slate-500 mt-1">ไม่มีใครค้างหนี้กันแล้วในขณะนี้</p>
                      </div>
                    ) : (
                      settlement.transfers.map((s, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                          <div className="flex justify-between items-center mb-3 pb-3 border-b border-slate-100">
                            <div className="flex items-center gap-2 text-sm">
                              <span className="font-bold text-rose-600">{s.from}</span>
                              <span className="text-slate-300 text-[10px]">โอนให้ 👉</span>
                              <span className="font-bold text-emerald-600">{s.to}</span>
                            </div>
                            <span className="font-mono font-extrabold text-lg text-slate-800">{s.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</span>
                          </div>
                          
                          <div className="flex justify-center mt-2">
                            <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 text-center w-full">
                              <PromptPayQR promptPay={s.promptPay} amount={s.amount} />
                              <div className="mt-3">
                                {s.promptPay ? (
                                  <button onClick={() => { navigator.clipboard.writeText(s.promptPay); alert('คัดลอกเบอร์พร้อมเพย์แล้ว'); }} className="text-[11px] text-blue-700 font-bold bg-blue-100 px-3 py-1.5 rounded-full hover:bg-blue-200 transition">
                                    คัดลอก: {s.promptPay}
                                  </button>
                                ) : (
                                  <span className="text-[11px] text-amber-600 bg-amber-50 px-2 py-1 rounded font-medium">ไม่ได้ระบุช่องทางรับเงิน</span>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
          <p className="text-center text-[10px] text-slate-400 mt-4 pb-4">Developed by Gemini ✦ Realtime Sync Active</p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
