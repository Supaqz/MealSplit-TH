<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealSplit TH - ระบบหารค่าข้าว</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [friends, setFriends] = useState(() => JSON.parse(localStorage.getItem('ms_friends')) || []);
      const [meals, setMeals] = useState(() => JSON.parse(localStorage.getItem('ms_meals')) || []);

      useEffect(() => {
        localStorage.setItem('ms_friends', JSON.stringify(friends));
      }, [friends]);

      useEffect(() => {
        localStorage.setItem('ms_meals', JSON.stringify(meals));
      }, [meals]);

      const handleAddFriend = (e) => {
        e.preventDefault();
        const name = e.target.name.value.trim();
        const promptPay = e.target.promptPay.value.trim();
        if (name) {
          setFriends([...friends, { id: Date.now().toString(), name, promptPay }]);
          e.target.reset();
        }
      };

      const handleAddMeal = (e) => {
        e.preventDefault();
        const title = e.target.title.value.trim();
        const amount = parseFloat(e.target.amount.value);
        const payerId = e.target.payerId.value;
        if (title && amount && payerId) {
          setMeals([...meals, { 
            id: Date.now().toString(), 
            title, 
            amount, 
            payerId, 
            date: new Date().toLocaleDateString('th-TH') 
          }]);
          e.target.reset();
        }
      };

      const deleteMeal = (id) => setMeals(meals.filter(m => m.id !== id));
      const deleteFriend = (id) => setFriends(friends.filter(f => f.id !== id));

      return (
        <div className="max-w-md mx-auto p-4 space-y-6">
          <header className="text-center py-4">
            <h1 className="text-2xl font-bold text-indigo-600">MealSplit TH</h1>
            <p className="text-sm text-slate-500">ระบบบันทึกบิลและหารค่าข้าว</p>
          </header>

          <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 className="font-bold mb-3 text-slate-700">👥 จัดการรายชื่อเพื่อน</h2>
            <form onSubmit={handleAddFriend} className="space-y-3 mb-4">
              <input name="name" placeholder="ชื่อเพื่อน" className="w-full p-2 border border-slate-300 rounded-lg text-sm" required />
              <input name="promptPay" placeholder="พร้อมเพย์ (ถ้ามี)" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
              <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-indigo-700 transition">เพิ่มเพื่อน</button>
            </form>
            <div className="space-y-2">
              {friends.map(f => (
                <div key={f.id} className="flex justify-between items-center p-2 bg-slate-50 rounded-lg text-sm">
                  <span><span className="font-semibold">{f.name}</span> {f.promptPay && <span className="text-xs text-slate-400">({f.promptPay})</span>}</span>
                  <button onClick={() => deleteFriend(f.id)} className="text-rose-500 font-bold px-2">X</button>
                </div>
              ))}
            </div>
          </section>

          <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 className="font-bold mb-3 text-slate-700">🍽️ บันทึกมื้ออาหาร</h2>
            <form onSubmit={handleAddMeal} className="space-y-3 mb-4">
              <input name="title" placeholder="ชื่อรายการ (เช่น ชาบูหม่าล่า)" className="w-full p-2 border border-slate-300 rounded-lg text-sm" required />
              <input name="amount" type="number" step="0.01" placeholder="ยอดรวมทั้งหมด (บาท)" className="w-full p-2 border border-slate-300 rounded-lg text-sm" required />
              <select name="payerId" className="w-full p-2 border border-slate-300 rounded-lg text-sm" required>
                <option value="">-- ใครเป็นคนจ่าย? --</option>
                {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
              </select>
              <button type="submit" disabled={friends.length === 0} className="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-emerald-700 transition disabled:opacity-50">
                {friends.length === 0 ? 'กรุณาเพิ่มเพื่อนก่อน' : 'บันทึกบิล'}
              </button>
            </form>
            <div className="space-y-2">
              {meals.map(m => {
                const payer = friends.find(f => f.id === m.payerId);
                return (
                  <div key={m.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100">
                    <div>
                      <p className="font-bold text-sm">{m.title}</p>
                      <p className="text-xs text-slate-500">จ่ายโดย: {payer ? payer.name : 'ลบไปแล้ว'} • {m.date}</p>
                    </div>
                    <div className="text-right">
                      <p className="font-mono font-bold text-rose-600">{m.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</p>
                      <button onClick={() => deleteMeal(m.id)} className="text-[10px] text-slate-400 hover:text-rose-500 underline">ลบรายการ</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
