<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealSplit TH - ระบบหารค่าข้าว & หักลบหนี้ (Full Version)</title>

  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3170/3170733.png">
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style> 
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
      projectId: "mealsplit-th",
      appId: "1:575865319667:web:df3d76a11f4f944656c786",
      apiKey: "AIzaSyDDPQOrGwIj7ggnzGpDfiNW612fVLGt0HU",
      authDomain: "mealsplit-th.firebaseapp.com",
      storageBucket: "mealsplit-th.firebasestorage.app",
      messagingSenderId: "575865319667",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // 2. HELPER FUNCTIONS
    // ==========================================
    function generatePromptPayPayload(target, amount) {
      target = target ? target.replace(/[^0-9]/g, '') : '';
      if (!target) return "";
      const targetType = target.length >= 15 ? '03' : target.length >= 13 ? '02' : '01';
      const formattedTarget = target.length >= 13 ? target : ("0000000000000" + target.replace(/^0/, "66")).slice(-13);
      let data = [
        "000201", "010211", "29370016A000000677010111", targetType, 
        formattedTarget.length.toString().padStart(2, '0'), formattedTarget, "5802TH", "5303764"
      ];
      if (amount > 0) {
        const amtStr = amount.toFixed(2);
        data.push("54" + amtStr.length.toString().padStart(2, '0') + amtStr);
      }
      data.push("6304");
      let payload = data.join("");
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function calculateSettlement(meals, friends, settledDebts) {
      const balances = {};
      friends.forEach(f => balances[f.id] = { ...f, totalPaid: 0, totalOwed: 0, net: 0 });

      let totalExpense = 0;
      meals.forEach(m => {
        totalExpense += m.finalAmount;
        if(balances[m.payerId]) {
          balances[m.payerId].totalPaid += m.finalAmount;
          balances[m.payerId].net += m.finalAmount;
        }
        m.participants.forEach(p => {
          if(balances[p.friendId]) {
            balances[p.friendId].totalOwed += p.amount;
            balances[p.friendId].net -= p.amount;
          }
        });
      });

      // หักลบรายการที่กดชำระแล้ว (Settled)
      settledDebts.forEach(s => {
        if(balances[s.fromId] && balances[s.toId]) {
          balances[s.fromId].net += s.amount;
          balances[s.toId].net -= s.amount;
        }
      });

      let debtors = [];
      let creditors = [];
      Object.values(balances).forEach(b => {
        b.net = Math.round(b.net * 100) / 100;
        if (b.net < -0.01) debtors.push({ ...b, amount: Math.abs(b.net) });
        else if (b.net > 0.01) creditors.push({ ...b, amount: b.net });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transfers = [];
      let d = 0, c = 0;
      while (d < debtors.length && c < creditors.length) {
        const debtor = debtors[d];
        const creditor = creditors[c];
        const minAmount = Math.min(debtor.amount, creditor.amount);
        if (minAmount > 0.01) {
          transfers.push({
            id: `tr_${debtor.id}_${creditor.id}_${Date.now()}`,
            fromId: debtor.id, fromName: debtor.name,
            toId: creditor.id, toName: creditor.name,
            amount: minAmount, promptPay: creditor.promptPay,
            bankName: creditor.bankName, bankAccount: creditor.bankAccount
          });
        }
        debtor.amount -= minAmount;
        creditor.amount -= minAmount;
        if (debtor.amount <= 0.01) d++;
        if (creditor.amount <= 0.01) c++;
      }
      return { totalExpense, transfers, balances };
    }

    // ==========================================
    // 3. UI COMPONENTS & MODALS
    // ==========================================
    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in">
          <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
              <h2 className="font-bold text-slate-800">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-rose-500 font-bold px-2 py-1">✕</button>
            </div>
            <div className="p-5 overflow-y-auto hide-scrollbar flex-1 bg-white">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const PromptPayQRModal = ({ isOpen, onClose, transfer }) => {
      if (!isOpen || !transfer) return null;
      const [src, setSrc] = useState('');
      useEffect(() => {
        const payload = generatePromptPayPayload(transfer.promptPay, transfer.amount);
        if (payload) QRCode.toDataURL(payload, { margin: 2, scale: 6 }, (err, url) => { if (!err) setSrc(url); });
      }, [transfer]);

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="สแกนเพื่อโอนเงิน">
          <div className="text-center space-y-4">
            <div className="bg-emerald-50 text-emerald-800 p-3 rounded-xl border border-emerald-200">
              <p className="text-sm">ยอดโอนสุทธิ</p>
              <h3 className="text-3xl font-mono font-bold">{transfer.amount.toLocaleString()} ฿</h3>
            </div>
            <div className="flex justify-center my-4">
              {src ? <img src={src} alt="QR" className="rounded-xl shadow-md border border-slate-200 w-48 h-48" /> : <p className="text-rose-500">ผู้รับยังไม่ผูกพร้อมเพย์</p>}
            </div>
            <div className="bg-slate-50 p-3 rounded-xl text-sm text-slate-600 text-left space-y-2">
              <p className="flex justify-between"><span>ผู้รับเงิน:</span> <strong className="text-slate-800">{transfer.toName}</strong></p>
              <p className="flex justify-between"><span>พร้อมเพย์:</span> <strong className="font-mono text-indigo-600">{transfer.promptPay || '-'}</strong></p>
              {transfer.bankAccount && <p className="flex justify-between"><span>บัญชีธนาคาร:</span> <strong className="font-mono">{transfer.bankName} {transfer.bankAccount}</strong></p>}
            </div>
            <button onClick={() => { navigator.clipboard.writeText(transfer.promptPay || transfer.bankAccount || ''); alert('คัดลอกเลขบัญชีแล้ว'); }} className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">
              คัดลอกเลขบัญชี / พร้อมเพย์
            </button>
          </div>
        </Modal>
      );
    };

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('meals');
      const [friends, setFriends] = useState([]);
      const [meals, setMeals] = useState([]);
      const [categories, setCategories] = useState([{ id: 'c1', name: 'ทั่วไป', icon: '🍽️' }, { id: 'c2', name: 'ปาร์ตี้', icon: '🍻' }]);
      const [settledDebts, setSettledDebts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const summaryRef = useRef(null);

      // Modals State
      const [modals, setModals] = useState({
        addMeal: false, friends: false, qr: false, category: false, export: false, line: false, sheets: false
      });
      const [selectedTransfer, setSelectedTransfer] = useState(null);

      // โหลดข้อมูล Firebase
      useEffect(() => {
        const unsubs = [
          db.collection('friends').onSnapshot(s => setFriends(s.docs.map(d => ({id: d.id, ...d.data()})))),
          db.collection('meals').orderBy('createdAt', 'desc').onSnapshot(s => setMeals(s.docs.map(d => ({id: d.id, ...d.data()})))),
          db.collection('categories').onSnapshot(s => s.docs.length > 0 && setCategories(s.docs.map(d => ({id: d.id, ...d.data()})))),
          db.collection('settled_debts').onSnapshot(s => setSettledDebts(s.docs.map(d => ({id: d.id, ...d.data()}))))
        ];
        setIsLoading(false);
        return () => unsubs.forEach(u => u());
      }, []);

      const openModal = (name, data = null) => {
        if(name === 'qr') setSelectedTransfer(data);
        setModals({ ...modals, [name]: true });
      };
      const closeModal = (name) => setModals({ ...modals, [name]: false });

      const handleAddMeal = async (e) => {
          e.preventDefault();
          
          //ใช้ FormData ดึงค่าจากฟอร์มทั้งหมดอย่างปลอดภัย
          const formData = new FormData(e.target);
          
          const title = formData.get('title');
          const date = formData.get('date');
          const categoryId = formData.get('category');
          const baseAmount = parseFloat(formData.get('amount'));
          const payerId = formData.get('payerId');
          const participantIds = formData.getAll('participants'); 
          
          const hasVat = formData.get('hasVat') !== null;
          const hasSc = formData.get('hasServiceCharge') !== null;

        if (title && baseAmount && payerId && participantIds.length > 0) {
          let finalAmount = baseAmount;
          if (hasSc) finalAmount += (finalAmount * 0.10);
          if (hasVat) finalAmount += (finalAmount * 0.07);

          const splitAmount = Math.round((finalAmount / participantIds.length) * 100) / 100;
          const participants = participantIds.map(id => ({ friendId: id, amount: splitAmount }));

          await db.collection('meals').add({
            title, categoryId: e.target.category.value, baseAmount, finalAmount,
            hasVat, hasSc, payerId, participants,
            date: e.target.date.value, splitMode: 'equal',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          closeModal('addMeal');
        } else alert('กรอกข้อมูลไม่ครบถ้วน');
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        const name = e.target.name.value;
        if(name) {
          await db.collection('friends').add({ 
            name, promptPay: e.target.promptPay.value, bankName: e.target.bankName.value, bankAccount: e.target.bankAccount.value,
            createdAt: firebase.firestore.FieldValue.serverTimestamp() 
          });
          e.target.reset();
        }
      };

      const handleSettleDebt = async (transfer) => {
        if(confirm(`ยืนยันการทำรายการชำระเงิน ${transfer.amount} บาท ให้ ${transfer.toName}?`)) {
          await db.collection('settled_debts').add({
            fromId: transfer.fromId, toId: transfer.toId, amount: transfer.amount,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      };

      const exportToImage = async () => {
        if (summaryRef.current) {
          const canvas = await html2canvas(summaryRef.current, { scale: 2 });
          const link = document.createElement('a');
          link.download = `สรุปค่าอาหาร.png`;
          link.href = canvas.toDataURL();
          link.click();
        }
      };

      const settlementData = useMemo(() => calculateSettlement(meals, friends, settledDebts), [meals, friends, settledDebts]);

      if (isLoading) return <div className="text-center mt-20 font-bold text-indigo-600">กำลังเชื่อมต่อข้อมูล...</div>;

      return (
        <div className="max-w-md mx-auto bg-slate-100 min-h-screen sm:border-x sm:border-slate-200 shadow-xl flex flex-col relative">
          
          {/* NAVBAR */}
          <div className="bg-indigo-700 text-white p-4 sticky top-0 z-10 shadow-md">
            <h1 className="text-xl font-bold tracking-tight">MealSplit TH</h1>
            <p className="text-xs text-indigo-200">ระบบหารค่าข้าว & หักลบหนี้ (Online)</p>
          </div>

          <div className="flex bg-white shadow-sm sticky top-[68px] z-10 text-sm font-semibold text-slate-500">
            <button onClick={() => setActiveTab('meals')} className={`flex-1 py-3 ${activeTab === 'meals' ? 'text-indigo-600 border-b-2 border-indigo-600' : ''}`}>บิลอาหาร</button>
            <button onClick={() => setActiveTab('settle')} className={`flex-1 py-3 ${activeTab === 'settle' ? 'text-indigo-600 border-b-2 border-indigo-600' : ''}`}>เคลียร์หนี้</button>
            <button onClick={() => setActiveTab('calendar')} className={`flex-1 py-3 ${activeTab === 'calendar' ? 'text-indigo-600 border-b-2 border-indigo-600' : ''}`}>ปฏิทิน</button>
          </div>

          {/* VIEWS */}
          <div className="p-4 flex-1 overflow-y-auto pb-24">
            
            {/* 1.1 MEALS VIEW */}
            {activeTab === 'meals' && (
              <div className="space-y-4 animate-fade-in">
                <div className="grid grid-cols-2 gap-3 text-white">
                  <div className="bg-indigo-500 p-4 rounded-2xl shadow-sm">
                    <p className="text-xs text-indigo-100">ยอดรวมทั้งหมด</p>
                    <h3 className="text-xl font-mono font-bold mt-1">{settlementData.totalExpense.toLocaleString()} ฿</h3>
                  </div>
                  <div className="bg-emerald-500 p-4 rounded-2xl shadow-sm">
                    <p className="text-xs text-emerald-100">จำนวนมื้อ / เพื่อน</p>
                    <h3 className="text-xl font-mono font-bold mt-1">{meals.length} / {friends.length}</h3>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => openModal('addMeal')} className="flex-1 bg-slate-800 text-white py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-slate-900">+ เพิ่มมื้ออาหาร</button>
                  <button onClick={() => openModal('friends')} className="flex-1 bg-white border border-slate-300 text-slate-700 py-2.5 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50">👥 จัดการเพื่อน</button>
                </div>

                <div className="space-y-3 mt-4">
                  {meals.map(m => (
                    <div key={m.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-semibold">{categories.find(c=>c.id===m.categoryId)?.name || 'ทั่วไป'}</span>
                          <h4 className="font-bold text-slate-800 text-sm mt-1">{m.title}</h4>
                          <p className="text-[10px] text-slate-400">{m.date}</p>
                        </div>
                        <div className="text-right">
                          <span className="font-mono font-bold text-rose-600 text-base">{m.finalAmount.toLocaleString()} ฿</span>
                          <button onClick={() => db.collection('meals').doc(m.id).delete()} className="block ml-auto mt-1 text-[10px] text-slate-400 hover:text-rose-500">ลบ</button>
                        </div>
                      </div>
                      <div className="bg-slate-50 p-2.5 rounded-xl text-xs text-slate-600 space-y-1">
                        <p>จ่ายโดย: <strong className="text-emerald-600">{friends.find(f=>f.id===m.payerId)?.name}</strong></p>
                        <p>คนหาร: {m.participants.map(p => friends.find(f=>f.id===p.friendId)?.name).join(', ')}</p>
                      </div>
                    </div>
                  ))}
                  {meals.length === 0 && <p className="text-center text-slate-400 py-6 text-sm">ยังไม่มีประวัติบิล</p>}
                </div>
              </div>
            )}

            {/* 1.2 SETTLEMENT VIEW */}
            {activeTab === 'settle' && (
              <div className="space-y-4 animate-fade-in">
                <div className="grid grid-cols-3 gap-2">
                  <button onClick={() => openModal('qr')} className="bg-blue-50 text-blue-700 py-2 rounded-xl text-xs font-bold border border-blue-200">LINE Share</button>
                  <button onClick={() => openModal('export')} className="bg-emerald-50 text-emerald-700 py-2 rounded-xl text-xs font-bold border border-emerald-200">บันทึกรูปภาพ</button>
                  <button onClick={() => openModal('sheets')} className="bg-amber-50 text-amber-700 py-2 rounded-xl text-xs font-bold border border-amber-200">Google Sheets</button>
                </div>

                <div ref={summaryRef} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                  <h3 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2">🎯 สรุปยอดโอนสุทธิ (หักลบแล้ว)</h3>
                  <div className="space-y-3">
                    {settlementData.transfers.length === 0 ? (
                      <p className="text-center text-emerald-600 font-bold py-4">✅ เคลียร์ยอดครบถ้วน</p>
                    ) : (
                      settlementData.transfers.map((s, i) => (
                        <div key={i} className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center justify-between">
                          <div>
                            <div className="text-sm">
                              <strong className="text-rose-600">{s.fromName}</strong> <span className="text-[10px] text-slate-400">โอนให้</span> <strong className="text-emerald-600">{s.toName}</strong>
                            </div>
                            <button onClick={() => openModal('qr', s)} className="text-[10px] text-indigo-600 font-bold mt-1 hover:underline">📱 สแกน QR / ดูเลขบัญชี</button>
                          </div>
                          <div className="text-right">
                            <span className="font-mono font-bold text-base text-slate-800">{s.amount.toLocaleString()} ฿</span>
                            <button onClick={() => handleSettleDebt(s)} className="block ml-auto mt-1 px-2 py-0.5 bg-emerald-600 text-white text-[10px] rounded hover:bg-emerald-700">ชำระแล้ว</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <h3 className="font-bold text-slate-800 text-sm mt-6 mb-3 border-b pb-2">💸 สถานะรายบุคคล</h3>
                  <div className="space-y-2">
                    {friends.map(f => {
                      const net = settlementData.balances[f.id].net;
                      return (
                        <div key={f.id} className="flex justify-between items-center text-xs p-2 rounded hover:bg-slate-50">
                          <span className="font-semibold text-slate-700">{f.name}</span>
                          <span className={`font-mono font-bold ${net > 0 ? 'text-emerald-600' : net < 0 ? 'text-rose-600' : 'text-slate-400'}`}>
                            {net > 0 ? '+' : ''}{net.toLocaleString()} ฿
                          </span>
                        </div>
                      )
                    })}
                  </div>
                </div>

                {settledDebts.length > 0 && (
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <h3 className="font-bold text-slate-800 text-sm mb-3">🕒 ประวัติการชำระเงิน</h3>
                    <div className="space-y-2">
                      {settledDebts.map(s => (
                        <div key={s.id} className="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg text-slate-500">
                          <span>{friends.find(f=>f.id===s.fromId)?.name} ➔ {friends.find(f=>f.id===s.toId)?.name}</span>
                          <div className="flex items-center gap-2">
                            <span className="font-mono">{s.amount.toLocaleString()} ฿</span>
                            <button onClick={() => db.collection('settled_debts').doc(s.id).delete()} className="text-rose-500 font-bold hover:underline">เลิกทำ</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 1.3 CALENDAR VIEW (Simplified Grid) */}
            {activeTab === 'calendar' && (
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 animate-fade-in">
                <h3 className="font-bold text-slate-800 text-sm mb-4">📅 ปฏิทินรายจ่าย</h3>
                <div className="space-y-3">
                  {Object.entries(meals.reduce((acc, m) => {
                    acc[m.date] = (acc[m.date] || 0) + m.finalAmount; return acc;
                  }, {})).sort((a,b) => new Date(b[0]) - new Date(a[0])).map(([date, total]) => (
                    <div key={date} className="flex justify-between p-3 bg-indigo-50 text-indigo-900 rounded-xl">
                      <span className="font-semibold text-sm">{date}</span>
                      <span className="font-mono font-bold">{total.toLocaleString()} ฿</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>

          {/* ================= MODALS ================= */}
          
          {/* Add Meal Modal */}
          <Modal isOpen={modals.addMeal} onClose={() => closeModal('addMeal')} title="บันทึกมื้ออาหารใหม่">
            <form onSubmit={handleAddMeal} className="space-y-3">
              <input name="title" placeholder="ชื่อรายการ (เช่น ชาบู)" className="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:border-indigo-500" required />
              <div className="flex gap-2">
                <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-1/2 p-2.5 border border-slate-300 rounded-xl text-xs outline-none" required />
                <select name="category" className="w-1/2 p-2.5 border border-slate-300 rounded-xl text-xs outline-none bg-white">
                  {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                </select>
              </div>
              <input name="amount" type="number" step="0.01" placeholder="ยอดรวมทั้งบิล (บาท) *" className="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:border-indigo-500 font-mono font-bold" required />
              
              <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex gap-4 text-xs font-semibold text-slate-600">
                <label className="flex items-center gap-1"><input type="checkbox" name="hasServiceCharge" className="rounded text-indigo-600" /> + Service 10%</label>
                <label className="flex items-center gap-1"><input type="checkbox" name="hasVat" className="rounded text-indigo-600" /> + VAT 7%</label>
              </div>

              <select name="payerId" className="w-full p-2.5 border border-slate-300 rounded-xl text-sm bg-white outline-none" required>
                <option value="">-- เลือกคนสำรองจ่าย --</option>
                {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
              </select>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <p className="text-xs font-bold text-slate-700 mb-2">เลือกร่วมหาร (หารเท่ากัน)</p>
                <div className="grid grid-cols-2 gap-2">
                  {friends.map(f => (
                    <label key={f.id} className="flex items-center gap-2 text-sm">
                      <input type="checkbox" name="participants" value={f.id} className="rounded text-indigo-600" defaultChecked /> {f.name}
                    </label>
                  ))}
                </div>
              </div>
              <button className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md">บันทึกบิล</button>
            </form>
          </Modal>

          {/* Friends Modal */}
          <Modal isOpen={modals.friends} onClose={() => closeModal('friends')} title="จัดการเพื่อนและบัญชีรับเงิน">
            <form onSubmit={handleAddFriend} className="mb-4 space-y-2">
              <input name="name" placeholder="ชื่อเล่น *" className="w-full p-2 border border-slate-300 rounded-lg text-sm" required />
              <input name="promptPay" placeholder="เบอร์พร้อมเพย์" className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono" />
              <div className="flex gap-2">
                <input name="bankName" placeholder="ชื่อธนาคาร" className="w-1/3 p-2 border border-slate-300 rounded-lg text-xs" />
                <input name="bankAccount" placeholder="เลขบัญชี" className="w-2/3 p-2 border border-slate-300 rounded-lg text-xs font-mono" />
              </div>
              <button className="w-full py-2 bg-emerald-600 text-white font-bold rounded-lg text-sm">เพิ่มเพื่อน</button>
            </form>
            <div className="space-y-2">
              {friends.map(f => (
                <div key={f.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100">
                  <div>
                    <p className="font-bold text-sm text-slate-800">{f.name}</p>
                    <p className="text-[10px] text-slate-500 font-mono">{f.promptPay || f.bankAccount || 'ไม่มีบัญชี'}</p>
                  </div>
                  <button onClick={() => deleteFriend(f.id)} className="text-rose-500 text-xs font-bold">ลบ</button>
                </div>
              ))}
            </div>
          </Modal>

          {/* PromptPay QR Modal */}
          <PromptPayQRModal isOpen={modals.qr} onClose={() => closeModal('qr')} transfer={selectedTransfer} />

          {/* Export / Share Webhook Modal */}
          <Modal isOpen={modals.export} onClose={() => closeModal('export')} title="บันทึกรูปภาพสรุปยอด">
            <div className="text-center space-y-4">
              <p className="text-sm text-slate-600">ระบบจะทำการจับภาพหน้าจอสรุปยอด (ด้านหลัง) แล้วเซฟลงเครื่องของคุณ</p>
              <button onClick={() => { closeModal('export'); exportToImage(); }} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md">ดาวน์โหลดรูปภาพ (.PNG)</button>
            </div>
          </Modal>

          {/* Google Sheets Modal */}
          <Modal isOpen={modals.sheets} onClose={() => closeModal('sheets')} title="ส่งออก Google Sheets">
            <div className="space-y-4">
              <p className="text-xs text-slate-600">วาง URL ของ Google Apps Script ที่คุณเขียนไว้รับ Webhook ข้อมูล</p>
              <input type="text" placeholder="https://script.google.com/macros/s/..." className="w-full p-3 border border-slate-300 rounded-xl text-xs font-mono outline-none" />
              <button onClick={() => { alert('ส่งข้อมูลเรียบร้อย (Mock)'); closeModal('sheets'); }} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md">ส่งออกข้อมูลทั้งหมด</button>
            </div>
          </Modal>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
