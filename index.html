<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealSplit TH - ระบบหารค่าข้าว & หักลบหนี้อัตโนมัติ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Google Material Icons สำหรับไอคอน UI -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style> 
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #0f172a; } 
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
      projectId: "mealsplit-th",
      appId: "1:575865319667:web:df3d76a11f4f944656c786",
      apiKey: "AIzaSyDDPQOrGwIj7ggnzGpDfiNW612fVLGt0HU",
      authDomain: "mealsplit-th.firebaseapp.com",
      storageBucket: "mealsplit-th.firebasestorage.app",
      messagingSenderId: "575865319667",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DEFAULT_CATEGORIES = [
      { id: 'general', label: 'ทั่วไป', icon: '🍽️' },
      { id: 'shabu', label: 'ชาบู/ปิ้งย่าง', icon: '🍲' },
      { id: 'cafe', label: 'คาเฟ่/ของหวาน', icon: '☕' },
      { id: 'party', label: 'ปาร์ตี้/แอลกอฮอล์', icon: '🍻' },
    ];

    // ==========================================
    // 2. HELPER LOGIC
    // ==========================================
    function generatePromptPayPayload(target, amount) {
      target = target ? target.replace(/[^0-9]/g, '') : '';
      if (!target) return "";
      const targetType = target.length >= 15 ? '03' : target.length >= 13 ? '02' : '01';
      const formattedTarget = target.length >= 13 ? target : ("0000000000000" + target.replace(/^0/, "66")).slice(-13);
      let data = [
        "000201", "010211", "29370016A000000677010111", targetType, 
        formattedTarget.length.toString().padStart(2, '0'), formattedTarget, "5802TH", "5303764"
      ];
      if (amount > 0) {
        const amtStr = amount.toFixed(2);
        data.push("54" + amtStr.length.toString().padStart(2, '0') + amtStr);
      }
      data.push("6304");
      let payload = data.join("");
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function calculateSettlement(meals, friends, settledDebts) {
      const balances = {};
      friends.forEach(f => balances[f.id] = { ...f, totalPaid: 0, totalOwed: 0, net: 0 });

      let totalExpense = 0;
      meals.forEach(m => {
        totalExpense += m.finalAmount;
        if(balances[m.payerId]) {
          balances[m.payerId].totalPaid += m.finalAmount;
          balances[m.payerId].net += m.finalAmount;
        }
        m.participants.forEach(p => {
          if(balances[p.friendId]) {
            balances[p.friendId].totalOwed += p.amount;
            balances[p.friendId].net -= p.amount;
          }
        });
      });

      // หักลบรายการที่เคลียร์ไปแล้ว
      settledDebts.forEach(s => {
        if(balances[s.fromId] && balances[s.toId]) {
          balances[s.fromId].net += s.amount;
          balances[s.toId].net -= s.amount;
        }
      });

      let debtors = [];
      let creditors = [];
      Object.values(balances).forEach(b => {
        b.net = Math.round(b.net * 100) / 100;
        if (b.net < -0.01) debtors.push({ ...b, amount: Math.abs(b.net) });
        else if (b.net > 0.01) creditors.push({ ...b, amount: b.net });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transfers = [];
      let d = 0, c = 0;
      while (d < debtors.length && c < creditors.length) {
        const debtor = debtors[d];
        const creditor = creditors[c];
        const minAmount = Math.min(debtor.amount, creditor.amount);
        if (minAmount > 0.01) {
          transfers.push({
            id: `tr_${debtor.id}_${creditor.id}_${Date.now()}`,
            fromId: debtor.id, fromName: debtor.name, fromColor: debtor.color,
            toId: creditor.id, toName: creditor.name, toColor: creditor.color,
            amount: minAmount, promptPay: creditor.promptPay,
            bankName: creditor.bankName, bankAccount: creditor.bankAccount
          });
        }
        debtor.amount -= minAmount;
        creditor.amount -= minAmount;
        if (debtor.amount <= 0.01) d++;
        if (creditor.amount <= 0.01) c++;
      }
      return { totalExpense, transfers, balances };
    }

    // ==========================================
    // 3. UI COMPONENTS
    // ==========================================
    const Icon = ({ name, className }) => <span className={`material-icons-round ${className}`}>{name}</span>;

    const Modal = ({ isOpen, onClose, title, children, fullWidth = false }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in">
          <div className={`bg-white rounded-2xl w-full ${fullWidth ? 'max-w-4xl' : 'max-w-lg'} shadow-2xl overflow-hidden flex flex-col max-h-[90vh]`}>
            <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50/80">
              <h2 className="font-bold text-slate-800 text-lg flex items-center gap-2">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-rose-500 font-bold p-1 rounded-lg hover:bg-slate-200 transition"><Icon name="close" className="text-xl"/></button>
            </div>
            <div className="p-0 overflow-y-auto hide-scrollbar flex-1 bg-white">
              {children}
            </div>
          </div>
        </div>
      );
    };

    function PromptPayQR({ promptPay, amount }) {
      const [src, setSrc] = useState('');
      useEffect(() => {
        const payload = generatePromptPayPayload(promptPay, amount);
        if (payload) {
          QRCode.toDataURL(payload, { margin: 1, scale: 6, color: { dark: '#1e293b', light: '#ffffff' } }, (err, url) => {
            if (!err) setSrc(url);
          });
        }
      }, [promptPay, amount]);
      if (!src) return <div className="text-xs text-slate-500 bg-slate-50 p-6 rounded-xl text-center border border-slate-200 border-dashed w-32 h-32 flex items-center justify-center">ไม่มีพร้อมเพย์</div>;
      return <img src={src} alt="QR" className="w-32 h-32 mx-auto rounded-xl shadow-sm border border-slate-200 p-1" />;
    }

    // ==========================================
    // 4. MAIN APP
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('meals');
      const [friends, setFriends] = useState([]);
      const [meals, setMeals] = useState([]);
      const [settledDebts, setSettledDebts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const summaryRef = useRef(null);

      // Modals
      const [modals, setModals] = useState({ addMeal: false, addFriend: false, qr: false, line: false });
      const [selectedTransfer, setSelectedTransfer] = useState(null);

      // Realtime Database Connection
      useEffect(() => {
        const unsubFriends = db.collection('friends').orderBy('createdAt', 'asc').onSnapshot(snap => {
          setFriends(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubMeals = db.collection('meals').orderBy('date', 'desc').onSnapshot(snap => {
          setMeals(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setIsLoading(false);
        });
        const unsubSettled = db.collection('settled_debts').onSnapshot(snap => {
          setSettledDebts(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        return () => { unsubFriends(); unsubMeals(); unsubSettled(); };
      }, []);

      const openModal = (name, data = null) => {
        if(name === 'qr') setSelectedTransfer(data);
        setModals({ ...modals, [name]: true });
      };
      const closeModal = (name) => setModals({ ...modals, [name]: false });

      const handleAddFriend = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('name').trim();
        if (name) {
          const colors = ['bg-indigo-500','bg-emerald-500','bg-rose-500','bg-amber-500','bg-purple-500', 'bg-cyan-500'];
          const color = colors[friends.length % colors.length];
          await db.collection('friends').add({ 
            name, promptPay: formData.get('promptPay').trim(), 
            bankName: formData.get('bankName').trim(), bankAccount: formData.get('bankAccount').trim(), 
            color, createdAt: firebase.firestore.FieldValue.serverTimestamp() 
          });
          closeModal('addFriend');
        }
      };

      const handleAddMeal = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const title = formData.get('title').trim();
        const baseAmount = parseFloat(formData.get('amount'));
        const payerId = formData.get('payerId');
        const participantIds = formData.getAll('participants');
        
        if (title && baseAmount && payerId && participantIds.length > 0) {
          const hasVat = formData.get('hasVat') !== null;
          const hasSc = formData.get('hasServiceCharge') !== null;
          let finalAmount = baseAmount;
          if (hasSc) finalAmount += (finalAmount * 0.10);
          if (hasVat) finalAmount += (finalAmount * 0.07);

          const splitAmount = Math.round((finalAmount / participantIds.length) * 100) / 100;
          const participants = participantIds.map(id => ({ friendId: id, amount: splitAmount }));

          await db.collection('meals').add({
            title, date: formData.get('date'), categoryId: formData.get('category'), 
            baseAmount, finalAmount, hasVat, hasServiceCharge: hasSc, 
            payerId, participants, splitMode: 'equal',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          closeModal('addMeal');
        } else alert('กรุณากรอกข้อมูลให้ครบถ้วน');
      };

      const handleSettleDebt = async (transfer) => {
        if(confirm(`ยืนยันการเคลียร์ยอด ${transfer.amount} บาท ให้ ${transfer.toName}?`)) {
          await db.collection('settled_debts').add({
            fromId: transfer.fromId, toId: transfer.toId, amount: transfer.amount,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      };

      const exportToImage = async () => {
        if (summaryRef.current) {
          const canvas = await html2canvas(summaryRef.current, { scale: 2, backgroundColor: '#f8fafc' });
          const link = document.createElement('a');
          link.download = `MealSplit_Summary_${new Date().toISOString().split('T')[0]}.png`;
          link.href = canvas.toDataURL();
          link.click();
        }
      };

      const shareToLine = () => {
        if (settleData.transfers.length === 0) return alert('เคลียร์ยอดครบแล้ว ไม่มีใครค้างเงิน');
        let text = `💸 สรุปยอดหารค่าอาหาร\nรวมทั้งหมด: ${settleData.totalExpense.toLocaleString()} บาท\n\n`;
        settleData.transfers.forEach(t => {
          text += `👉 ${t.fromName} โอนให้ ${t.toName}: ${t.amount.toLocaleString()} ฿\n`;
          if (t.promptPay) text += `   พร้อมเพย์: ${t.promptPay}\n`;
        });
        text += `\n✨ สรุปยอดโดย MealSplit TH`;
        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
      };

      const settleData = useMemo(() => calculateSettlement(meals, friends, settledDebts), [meals, friends, settledDebts]);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold bg-slate-50 flex-col gap-4"><div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>กำลังโหลดข้อมูล...</div>;

      return (
        <div className="max-w-6xl mx-auto min-h-screen flex flex-col bg-slate-50">
          
          {/* HEADER (เหมือนในภาพ) */}
          <div className="bg-indigo-600 text-white p-6 shadow-md relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white opacity-10 rounded-full blur-3xl"></div>
            <div className="flex justify-between items-center relative z-10">
              <div className="flex items-center gap-3">
                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                  <Icon name="receipt_long" className="text-3xl text-white" />
                </div>
                <div>
                  <h1 className="text-2xl font-extrabold tracking-tight flex items-center gap-2">MealSplit TH</h1>
                  <p className="text-indigo-200 text-sm mt-0.5 flex items-center gap-1.5">
                    ระบบหารค่าข้าว & หักลบหนี้ <span className="text-[10px] bg-emerald-500/20 text-emerald-100 px-2 py-0.5 rounded-full border border-emerald-400/30">Online - ซิงค์เรียลไทม์</span>
                  </p>
                </div>
              </div>
              {/* Top Action Buttons (Desktop) */}
              <div className="hidden md:flex gap-3">
                <button onClick={exportToImage} className="px-4 py-2 bg-indigo-800/50 hover:bg-indigo-800 text-indigo-100 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-indigo-500/30"><Icon name="image" className="text-base"/> บันทึกรูปภาพ</button>
                <button onClick={shareToLine} className="px-4 py-2 bg-[#06C755] hover:bg-[#00b349] text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm"><Icon name="chat" className="text-base"/> แชร์เข้า LINE</button>
                <button onClick={() => openModal('addMeal')} className="px-5 py-2 bg-white text-indigo-700 rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-50 transition flex items-center gap-2"><Icon name="add" className="text-base"/> ลงบันทึกมื้อใหม่</button>
              </div>
            </div>
          </div>

          {/* TABS */}
          <div className="flex bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30 font-semibold text-slate-500 text-sm">
            <button onClick={() => setActiveTab('meals')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition-colors ${activeTab === 'meals' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/30' : 'hover:bg-slate-50'}`}><Icon name="restaurant_menu" className="text-[18px]"/> บิลอาหาร ({meals.length})</button>
            <button onClick={() => setActiveTab('friends')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition-colors ${activeTab === 'friends' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/30' : 'hover:bg-slate-50'}`}><Icon name="group" className="text-[18px]"/> เพื่อน ({friends.length})</button>
            <button onClick={() => setActiveTab('settle')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition-colors ${activeTab === 'settle' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/30' : 'hover:bg-slate-50'}`}><Icon name="balance" className="text-[18px]"/> เคลียร์ยอด</button>
          </div>

          {/* CONTENT AREA */}
          <div className="p-4 sm:p-6 lg:p-8 flex-1">

            {/* Mobile Action Buttons */}
            <div className="md:hidden flex gap-2 mb-4 overflow-x-auto hide-scrollbar">
              <button onClick={() => openModal('addMeal')} className="shrink-0 px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1"><Icon name="add" className="text-sm"/> เพิ่มมื้อ</button>
              <button onClick={exportToImage} className="shrink-0 px-4 py-2 bg-white text-slate-700 border border-slate-200 rounded-xl text-xs font-bold flex items-center gap-1"><Icon name="image" className="text-sm"/> เซฟรูป</button>
              <button onClick={shareToLine} className="shrink-0 px-4 py-2 bg-[#06C755] text-white rounded-xl text-xs font-bold flex items-center gap-1"><Icon name="chat" className="text-sm"/> แชร์ LINE</button>
            </div>
            
            {/* ================= 1. MEALS VIEW ================= */}
            {activeTab === 'meals' && (
              <div className="space-y-4 animate-fade-in">
                {/* Search Bar (UI Mock) */}
                <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
                  <Icon name="search" className="text-slate-400 pl-2" />
                  <input type="text" placeholder="ค้นหาชื่อร้าน, สถานที่, หรือชื่อเพื่อน..." className="w-full text-sm outline-none text-slate-700" />
                  <select className="bg-slate-50 border border-slate-200 text-xs text-slate-600 p-2 rounded-lg outline-none cursor-pointer">
                    <option>เรียงตาม: วันที่ล่าสุด</option>
                    <option>เรียงตาม: ยอดเงินสูงสุด</option>
                  </select>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5 mt-6">
                  {meals.map(m => {
                    const payer = friends.find(f => f.id === m.payerId);
                    const parts = m.participants.map(p => friends.find(f=>f.id===p.friendId));
                    const cat = DEFAULT_CATEGORIES.find(c => c.id === m.categoryId) || DEFAULT_CATEGORIES[0];
                    
                    return (
                      <div key={m.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-300 transition-colors overflow-hidden">
                        <div className="p-5">
                          <div className="flex justify-between items-start mb-3">
                            <div className="flex items-center gap-2.5 bg-amber-50 text-amber-700 px-3 py-1 rounded-full text-[10px] font-bold border border-amber-100">
                              <span>{cat.label}</span>
                            </div>
                            <div className="flex items-center gap-2 text-xs text-slate-500 font-mono bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">
                              <Icon name="calendar_today" className="text-sm text-slate-400"/> {m.date}
                            </div>
                          </div>
                          <h4 className="font-bold text-slate-800 text-lg mb-4">{m.title}</h4>
                          <div className="flex justify-between items-end">
                            <div className="text-xs text-slate-500 space-y-1">
                              <p>คนจ่าย: <strong className="text-indigo-600">{payer?.name || '?'}</strong></p>
                              <div className="flex items-center gap-1.5 mt-1">
                                <span className="mr-1">คนหาร ({parts.length}):</span>
                                <div className="flex -space-x-2">
                                  {parts.slice(0,3).map((p, i) => (
                                    <div key={i} className={`w-6 h-6 rounded-full text-white flex items-center justify-center text-[10px] font-bold border-2 border-white ${p?.color || 'bg-slate-400'}`}>{p?.name?.charAt(0) || '?'}</div>
                                  ))}
                                  {parts.length > 3 && <div className="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[9px] font-bold border-2 border-white">+{parts.length - 3}</div>}
                                </div>
                              </div>
                            </div>
                            <div className="text-right">
                              <span className="block text-[10px] text-slate-400 font-bold uppercase tracking-wide mb-1">ยอดรวมบิล</span>
                              <span className="font-mono font-extrabold text-2xl text-slate-900">{m.finalAmount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                            </div>
                          </div>
                        </div>
                        <div className="bg-slate-50 border-t border-slate-100 px-4 py-3 flex justify-between items-center">
                          <button className="text-xs font-bold text-slate-600 flex items-center gap-1 hover:text-indigo-600 transition"><Icon name="visibility" className="text-[14px]"/> ดูบิล</button>
                          <div className="flex gap-1.5">
                            <button className="w-7 h-7 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 shadow-sm"><Icon name="content_copy" className="text-[14px]"/></button>
                            <button className="w-7 h-7 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-slate-400 hover:text-indigo-600 shadow-sm"><Icon name="edit" className="text-[14px]"/></button>
                            <button onClick={() => db.collection('meals').doc(m.id).delete()} className="w-7 h-7 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-rose-400 hover:text-rose-600 hover:bg-rose-50 shadow-sm transition"><Icon name="delete" className="text-[14px]"/></button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ================= 2. SETTLEMENT VIEW (เหมือนในภาพ) ================= */}
            {activeTab === 'settle' && (
              <div className="space-y-6 animate-fade-in" ref={summaryRef}>
                
                {/* กล่องสรุปยอดรวมด้านบน */}
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col md:flex-row justify-between md:items-center gap-4">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center border border-indigo-100"><Icon name="balance" className="text-2xl"/></div>
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs text-slate-500 font-bold">ยอดรวมทั้งหมด</span>
                        <span className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md font-bold">{meals.length} มื้อ</span>
                      </div>

          </form>
        </Modal>

        {/* Modal: สแกน QR Code */}
        <Modal isOpen={modals.qr} onClose={() => closeModal('qr')} title="สแกนเพื่อจ่ายเงิน">
          {selectedTransfer && (
            <div className="text-center space-y-5 p-2">
              <div className="flex items-center justify-center gap-3 text-sm font-bold">
                <span className="text-rose-600">{selectedTransfer.fromName}</span>
                <span className="text-slate-300 text-lg">➔</span>
                <span className="text-emerald-600">{selectedTransfer.toName}</span>
              </div>
              
              <div className="bg-rose-50 text-rose-700 p-4 rounded-2xl border border-rose-200">
                <p className="text-xs font-bold uppercase tracking-wider mb-1">ยอดโอนสุทธิ</p>
                <h3 className="text-4xl font-mono font-extrabold">{selectedTransfer.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</h3>
              </div>
              
              <div className="bg-blue-50/50 p-6 rounded-3xl border border-blue-100 flex flex-col items-center">
                <p className="text-xs font-bold text-blue-900 mb-4 flex items-center gap-1.5"><Icon name="qr_code_scanner"/> สแกน QR ผ่านแอปธนาคาร</p>
                <PromptPayQR promptPay={selectedTransfer.promptPay} amount={selectedTransfer.amount} />
                
                <div className="mt-5 w-full space-y-2">
                  {selectedTransfer.promptPay && (
                    <button onClick={() => { navigator.clipboard.writeText(selectedTransfer.promptPay); alert('คัดลอกพร้อมเพย์แล้ว'); }} className="w-full text-xs text-blue-700 font-bold bg-white border border-blue-200 px-4 py-3 rounded-xl hover:bg-blue-100 transition shadow-sm font-mono flex justify-center items-center gap-2">
                      <Icon name="content_copy" className="text-[16px]"/> พร้อมเพย์: {selectedTransfer.promptPay}
                    </button>
                  )}
                  {selectedTransfer.bankAccount && (
                    <button onClick={() => { navigator.clipboard.writeText(selectedTransfer.bankAccount); alert('คัดลอกเลขบัญชีแล้ว'); }} className="w-full text-[11px] text-slate-700 font-bold bg-white border border-slate-200 px-4 py-3 rounded-xl hover:bg-slate-100 transition shadow-sm font-mono flex justify-center items-center gap-2">
                      <Icon name="content_copy" className="text-[16px]"/> {selectedTransfer.bankName}: {selectedTransfer.bankAccount}
                    </button>
                  )}
                </div>
              </div>

              <button onClick={() => { handleSettleDebt(selectedTransfer); closeModal('qr'); }} className="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                <Icon name="check_circle" className="text-[18px]"/> มาร์คว่าโอนเรียบร้อยแล้ว
              </button>
            </div>
          )}
        </Modal>

      </div>
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
