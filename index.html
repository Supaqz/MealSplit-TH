    const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const THAI_DAYS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

    // ==========================================
    // 2. HELPER LOGIC
    // ==========================================
    function generatePromptPayPayload(target, amount) {
      target = target ? target.replace(/[^0-9]/g, '') : '';
      if (!target) return "";
      const targetType = target.length >= 15 ? '03' : target.length >= 13 ? '02' : '01';
      const formattedTarget = target.length >= 13 ? target : ("0000000000000" + target.replace(/^0/, "66")).slice(-13);
      let data = [
        "000201", "010211", "29370016A000000677010111", targetType, 
        formattedTarget.length.toString().padStart(2, '0'), formattedTarget, "5802TH", "5303764"
      ];
      if (amount > 0) {
        const amtStr = amount.toFixed(2);
        data.push("54" + amtStr.length.toString().padStart(2, '0') + amtStr);
      }
      data.push("6304");
      let payload = data.join("");
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function calculateSettlement(meals, friends, settledDebts) {
      const balances = {};
      friends.forEach(f => balances[f.id] = { ...f, totalPaid: 0, totalOwed: 0, net: 0 });

      const directDebts = {};
      const directHistory = {}; 
      
      friends.forEach(f => {
        directDebts[f.id] = {};
        directHistory[f.id] = {};
        friends.forEach(f2 => {
          directDebts[f.id][f2.id] = 0;
          directHistory[f.id][f2.id] = [];
        });
      });

      let totalExpense = 0; 
      
      meals.forEach(m => {
        totalExpense += m.finalAmount;
        if(balances[m.payerId]) {
          balances[m.payerId].totalPaid += m.finalAmount;
          balances[m.payerId].net += m.finalAmount;
        }
        m.participants.forEach(p => {
          if(balances[p.friendId]) {
            balances[p.friendId].totalOwed += p.amount;
            balances[p.friendId].net -= p.amount;
            
            if (p.friendId !== m.payerId) {
              directDebts[p.friendId][m.payerId] += p.amount;
              directHistory[p.friendId][m.payerId].push({ mealTitle: m.title, date: m.date, amount: p.amount });
            }
          }
        });
      });

      settledDebts.forEach(s => {
        if(balances[s.fromId] && balances[s.toId]) {
          balances[s.fromId].net += s.amount;
          balances[s.toId].net -= s.amount;
          directDebts[s.fromId][s.toId] -= s.amount; 
        }
      });

      const transfers = [];
      const processedPairs = new Set();
      let activeMealsSet = new Set();

      friends.forEach(f1 => {
        friends.forEach(f2 => {
          if (f1.id === f2.id) return;
          const pairKey = [f1.id, f2.id].sort().join('_');
          if (processedPairs.has(pairKey)) return;
          processedPairs.add(pairKey);

          const f1OwesF2 = directDebts[f1.id][f2.id];
          const f2OwesF1 = directDebts[f2.id][f1.id];
          const net = f1OwesF2 - f2OwesF1;

          if (Math.abs(net) > 0.01) {
            let fromId, toId, amount, fromName, toName, fromColor, toColor, creditor;
            let fromOwesToTotal, toOwesFromTotal;
            let historyFromOwesTo, historyToOwesFrom;
            let settledFromToTotal = 0, settledToFromTotal = 0;

            if (net > 0) {
              fromId = f1.id; toId = f2.id; amount = net;
              fromName = f1.name; toName = f2.name;
              fromColor = f1.color; toColor = f2.color;
              creditor = f2;
              historyFromOwesTo = directHistory[f1.id][f2.id];
              historyToOwesFrom = directHistory[f2.id][f1.id];
              settledFromToTotal = settledDebts.filter(s => s.fromId === f1.id && s.toId === f2.id).reduce((s, h) => s + h.amount, 0);
              settledToFromTotal = settledDebts.filter(s => s.fromId === f2.id && s.toId === f1.id).reduce((s, h) => s + h.amount, 0);
            } else {
              fromId = f2.id; toId = f1.id; amount = Math.abs(net);
              fromName = f2.name; toName = f1.name;
              fromColor = f2.color; toColor = f1.color;
              creditor = f1;
              historyFromOwesTo = directHistory[f2.id][f1.id];
              historyToOwesFrom = directHistory[f1.id][f2.id];
              settledFromToTotal = settledDebts.filter(s => s.fromId === f2.id && s.toId === f1.id).reduce((s, h) => s + h.amount, 0);
              settledToFromTotal = settledDebts.filter(s => s.fromId === f1.id && s.toId === f2.id).reduce((s, h) => s + h.amount, 0);
            }

            fromOwesToTotal = historyFromOwesTo.reduce((s, h) => s + h.amount, 0) - settledFromToTotal;
            toOwesFromTotal = historyToOwesFrom.reduce((s, h) => s + h.amount, 0) - settledToFromTotal;

            meals.forEach(m => {
              if ((m.payerId === toId && m.participants.some(p => p.friendId === fromId)) ||
                  (m.payerId === fromId && m.participants.some(p => p.friendId === toId))) {
                 activeMealsSet.add(m.id);
              }
            });

            transfers.push({
              id: `tr_${fromId}_${toId}_${Date.now()}`,
              fromId, fromName, fromColor,
              toId, toName, toColor,
              amount, 
              promptPay: creditor.promptPay,
              bankName: creditor.bankName, 
              bankAccount: creditor.bankAccount,
              fromOwesToTotal, toOwesFromTotal,
              historyFromOwesTo, historyToOwesFrom,
              settledFromToTotal, settledToFromTotal,
              historyCount: historyFromOwesTo.length + historyToOwesFrom.length
            });
          }
        });
      });

      transfers.sort((a, b) => b.amount - a.amount);

      let activeTotalExpense = 0;
      let activeMealsList = [];
      activeMealsSet.forEach(mealId => {
        const m = meals.find(x => x.id === mealId);
        if (m) {
          activeTotalExpense += m.finalAmount;
          activeMealsList.push(m);
        }
      });

      return { totalExpense, activeTotalExpense, activeMealsList, transfers, balances };
    }

    // ==========================================
    // 3. REUSABLE UI COMPONENTS
    // ==========================================
    const Icon = ({ name, className }) => <span className={`material-icons-round ${className}`}>{name}</span>;

    const Modal = ({ isOpen, onClose, title, children, fullWidth = false, noPadding = false }) => {

            {title && (

            <div className={`${noPadding ? '' : 'p-0'} overflow-y-auto hide-scrollbar flex-1 bg-white relative`}>

    function PromptPayQR({ promptPay, amount }) {
      const [src, setSrc] = useState('');
      useEffect(() => {
        const payload = generatePromptPayPayload(promptPay, amount);
        if (payload) {
          QRCode.toDataURL(payload, { margin: 1, scale: 6, color: { dark: '#1e293b', light: '#ffffff' } }, (err, url) => {
            if (!err) setSrc(url);
          });
        }
      }, [promptPay, amount]);
      if (!src) return <div className="text-xs text-slate-500 bg-slate-50 p-6 rounded-xl text-center border border-slate-200 border-dashed w-48 h-48 flex items-center justify-center">ไม่มีพร้อมเพย์</div>;
      return <img src={src} alt="QR" className="w-48 h-48 mx-auto rounded-xl shadow-sm border border-slate-200 p-2" />;
    }
    function ConfirmModal({ isOpen, onClose, title, message, onConfirm, confirmText = "ยืนยัน", confirmColor = "bg-rose-600 hover:bg-rose-700" }) {
      if (!isOpen) return null;
      return (
        <Modal isOpen={isOpen} onClose={onClose} title={title}>
          <div className="p-5 sm:p-6 text-center sm:text-left">
            <div className="flex flex-col sm:flex-row items-center gap-4 mb-6">
              <div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${confirmColor.includes('rose') ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}`}>
                <Icon name={confirmColor.includes('rose') ? "warning" : "help_outline"} className="text-3xl" />
              </div>
              <p className="text-sm text-slate-600">{message}</p>
            </div>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition">ยกเลิก</button>
              <button onClick={() => { onConfirm(); onClose(); }} className={`flex-1 py-3 text-white font-bold rounded-xl shadow-md transition ${confirmColor}`}>
                {confirmText}
              </button>
            </div>
          </div>
        </Modal>
      );
    }
    // ==========================================
    // 5. APP CONTAINER
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('settle');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      
      const [friends, setFriends] = useState([]);
      const [meals, setMeals] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [settledDebts, setSettledDebts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const summaryRef = useRef(null);

      const [modals, setModals] = useState({ addMeal: false, addFriend: false, qr: false, category: false, export: false, viewMeal: false });
      const [selectedTransfer, setSelectedTransfer] = useState(null);
      const [editingMeal, setEditingMeal] = useState(null);
      const [editingFriend, setEditingFriend] = useState(null);
      const [viewingMeal, setViewingMeal] = useState(null);
      // เพิ่ม State สำหรับป๊อปอัปยืนยัน
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null, confirmText: 'ยืนยัน', confirmColor: 'bg-rose-600 hover:bg-rose-700' });
      
      const showConfirm = (title, message, onConfirm, confirmText = 'ยืนยัน', confirmColor = 'bg-rose-600 hover:bg-rose-700') => {
        setConfirmDialog({ isOpen: true, title, message, onConfirm, confirmText, confirmColor });
      };
      const closeConfirm = () => setConfirmDialog(prev => ({ ...prev, isOpen: false }));

      useEffect(() => {
        const unsubFriends = db.collection('friends').orderBy('createdAt', 'asc').onSnapshot(snap => setFriends(snap.docs.map(d => ({id: d.id, ...d.data()}))));
        const unsubMeals = db.collection('meals').orderBy('date', 'desc').onSnapshot(snap => {
          setMeals(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setIsLoading(false);
        });
        const unsubCategories = db.collection('categories').orderBy('createdAt', 'asc').onSnapshot(snap => {
          if (snap.docs.length === 0) {
            // ถ้าในฐานข้อมูลว่างเปล่า ให้สร้างหมวดหมู่พื้นฐานเข้าไปเป็นข้อมูลจริงเลย
            DEFAULT_CATEGORIES.forEach((cat, idx) => {
              db.collection('categories').doc(cat.id).set({
                label: cat.label,
                icon: cat.icon,
                color: cat.color,
                createdAt: firebase.firestore.Timestamp.fromMillis(Date.now() + idx)
              });
            });
            setCategories(DEFAULT_CATEGORIES);
          } else {
            setCategories(snap.docs.map(d => ({id: d.id, ...d.data()})));
          }
        });
        const unsubSettled = db.collection('settled_debts').onSnapshot(snap => setSettledDebts(snap.docs.map(d => ({id: d.id, ...d.data()}))));
        return () => { unsubFriends(); unsubMeals(); unsubCategories(); unsubSettled(); };
      }, []);

      const openModal = (name, data = null) => {
        if (name === 'qr') setSelectedTransfer(data);
        if (name === 'addMeal') setEditingMeal(data);
        if (name === 'addFriend') setEditingFriend(data);
        if (name === 'viewMeal') setViewingMeal(data);
        setModals(prev => ({ ...prev, [name]: true }));
      };
      const closeModal = (name) => {
        if (name === 'addMeal') setEditingMeal(null);
        if (name === 'addFriend') setEditingFriend(null);
        if (name === 'viewMeal') setViewingMeal(null);
        setModals(prev => ({ ...prev, [name]: false }));
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('name').trim();
        if (name) {
          const data = { name, promptPay: formData.get('promptPay').trim(), bankName: formData.get('bankName').trim(), bankAccount: formData.get('bankAccount').trim() };
          if (editingFriend && editingFriend.id) {
            await db.collection('friends').doc(editingFriend.id).update(data);
          } else {
            const colors = ['bg-indigo-500','bg-emerald-500','bg-rose-500','bg-amber-500','bg-purple-500', 'bg-cyan-500'];
            data.color = colors[friends.length % colors.length];
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('friends').add(data);
          }
          closeModal('addFriend');
        }
      };

      const handleAddMeal = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const title = formData.get('title').trim();
        const baseAmount = parseFloat(formData.get('amount'));
        const payerId = formData.get('payerId');
        const participantIds = formData.getAll('participants');
        
        if (title && baseAmount && payerId && participantIds.length > 0) {
          const hasVat = formData.get('hasVat') !== null;
          const hasSc = formData.get('hasServiceCharge') !== null;
          const discountAmt = parseFloat(formData.get('discount')) || 0;
          const rounding = formData.get('rounding') || 'actual';

          let calcFinal = baseAmount - discountAmt;
          if (hasSc) calcFinal += (calcFinal * 0.10);
          if (hasVat) calcFinal += (calcFinal * 0.07);

          let splitAmountRaw = calcFinal / participantIds.length;
          let splitAmount = splitAmountRaw;
          if (rounding === 'ceil') splitAmount = Math.ceil(splitAmountRaw);
          else if (rounding === 'round') splitAmount = Math.round(splitAmountRaw);
          else if (rounding === 'floor') splitAmount = Math.floor(splitAmountRaw);

          const adjustedFinal = splitAmount * participantIds.length;
          const participants = participantIds.map(id => ({ friendId: id, amount: splitAmount }));

          const data = {
            title, date: formData.get('date'), categoryId: formData.get('category'), 
            baseAmount, finalAmount: adjustedFinal, discount: discountAmt, hasVat, hasServiceCharge: hasSc, 
            payerId, participants, splitMode: 'equal', roundingMode: rounding
          };

          if (editingMeal && editingMeal.id) {
            await db.collection('meals').doc(editingMeal.id).update(data);
          } else {
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('meals').add(data);
          }
          closeModal('addMeal');
        } else alert('กรุณากรอกข้อมูลให้ครบถ้วน');
      };

      const deleteMeal = (id) => {
        showConfirm('ยืนยันการลบรายการ', 'คุณต้องการลบรายการนี้ใช่หรือไม่? การคำนวณหักลบหนี้จะเปลี่ยนไปทันที', async () => {
          await db.collection('meals').doc(id).delete();
          closeModal('viewMeal');
        }, 'ลบรายการนี้', 'bg-rose-600 hover:bg-rose-700');
      };

      const handleSettleDebt = (transfer) => {
        showConfirm('ยืนยันการเคลียร์ยอด', `ยืนยันการโอนเงินจำนวน ${transfer.amount} บาท ให้ ${transfer.toName} เรียบร้อยแล้วใช่หรือไม่?`, async () => {
          await db.collection('settled_debts').add({
            fromId: transfer.fromId, toId: transfer.toId, amount: transfer.amount,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }, 'โอนเสร็จแล้ว เคลียร์เลย', 'bg-emerald-600 hover:bg-emerald-700');
      };

      const shareToLine = () => {
        if (settleData.transfers.length === 0) return alert('เคลียร์ยอดครบแล้ว ไม่มีใครค้างเงิน');
        let text = `💸 สรุปยอดหารค่าอาหาร (${settleData.activeMealsList.length} มื้อที่ค้างจ่าย)\nยอดรวมบิลรอบนี้: ${settleData.activeTotalExpense.toLocaleString()} บาท\n\n📌 ยอดที่ต้องโอนสุทธิ:\n`;
        settleData.transfers.forEach(t => {
          text += `👉 ${t.fromName} โอนให้ ${t.toName}: ${t.amount.toLocaleString()} ฿\n`;
          if (t.promptPay) text += `   พร้อมเพย์: ${t.promptPay}\n`;
          else if (t.bankAccount) text += `   บัญชี: ${t.bankName} ${t.bankAccount}\n`;
        });
        text += `\n✨ คำนวณโดย MealSplit TH`;
        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
      };

      const settleData = useMemo(() => calculateSettlement(meals, friends, settledDebts), [meals, friends, settledDebts]);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold flex-col gap-4"><Icon name="sync" className="animate-spin text-4xl"/> กำลังโหลดข้อมูล...</div>;

      return (
        <>
          <div className="max-w-6xl mx-auto min-h-screen flex flex-col bg-slate-50 border-x border-slate-200">
            {/* HEADER */}

                        {t.bankAccount && <div className="bg-white border border-slate-200 px-3 py-1.5 rounded-lg font-mono font-bold text-slate-700 shadow-sm">{t.bankName} {t.bankAccount}</div>}
                        {!t.promptPay && !t.bankAccount && <div className="text-rose-500 bg-rose-50 px-2 py-1 rounded border border-rose-100">ยังไม่ระบุบัญชีรับเงิน</div>}
                        <button onClick={() => onOpenQR(t)} className="ml-auto text-indigo-600 font-bold flex items-center gap-1 hover:underline"><Icon name="qr_code_2" className="text-[16px]"/> เปิด QR สแกนจ่าย</button>
                      </div>
                    </div>
                    
                    {/* สูตรคำนวณ Accordion */}
                    <div className="bg-slate-50 border-t border-slate-100 px-5 py-3 text-xs cursor-pointer hover:bg-slate-100 transition" onClick={() => setExpandedId(expandedId === idx ? null : idx)}>
                      <div className="flex justify-between items-center">
                        <span className="text-slate-500 font-medium">คำนวณจากประวัติบิล {t.historyCount} รายการ</span>
                        <span className="text-indigo-600 font-semibold flex items-center gap-1"><Icon name="calculate" className="text-[14px]"/> {expandedId === idx ? 'ซ่อนสูตรคำนวณ' : 'ดูสูตรคำนวณ'} <Icon name={expandedId === idx ? "expand_less" : "expand_more"} className="text-[16px]"/></span>
                      </div>
                      {expandedId === idx && (
                        <div className="mt-4 pt-4 border-t border-slate-200 space-y-3 cursor-default" onClick={e=>e.stopPropagation()}>
                          <div className="text-[11px] font-bold text-slate-700 flex items-center gap-1.5 mb-2">
                            <Icon name="history" className="text-indigo-500 text-[14px]"/> ขั้นตอนการคำนวณระหว่าง {t.fromName} และ {t.toName}:
                          </div>
                          
                          <div className="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                            <div className="flex justify-between font-bold text-slate-800 mb-2">
                              <span>1. {t.fromName} ติดหนี้ {t.toName}:</span>
                              <span className="text-rose-600">-{t.fromOwesToTotal.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                            </div>
                            {t.historyFromOwesTo.length > 0 ? (
                              <div className="space-y-1.5 text-[10px] text-slate-500">
                                {t.historyFromOwesTo.map((h, i) => (
                                  <div key={i} className="flex justify-between"><span className="truncate pr-2">• หารมื้อ "{h.mealTitle}" ({h.date})</span><span className="shrink-0">{h.amount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span></div>
                                ))}
                                {t.settledFromToTotal > 0 && <div className="text-emerald-600 font-semibold pt-1 border-t border-slate-100">• เคยโอนคืนไปแล้ว: -{t.settledFromToTotal.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</div>}
                              </div>
                            ) : <div className="text-[10px] text-slate-400">ไม่มีหนี้ค้าง</div>}
                          </div>

                          <div className="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                            <div className="flex justify-between font-bold text-slate-800 mb-2">
                              <span>2. {t.toName} ติดหนี้ {t.fromName}:</span>
                              <span className="text-rose-600">-{t.toOwesFromTotal.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                            </div>
                            {t.historyToOwesFrom.length > 0 ? (
                              <div className="space-y-1.5 text-[10px] text-slate-500">
                                {t.historyToOwesFrom.map((h, i) => (
                                  <div key={i} className="flex justify-between"><span className="truncate pr-2">• หารมื้อ "{h.mealTitle}" ({h.date})</span><span className="shrink-0">{h.amount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span></div>
                                ))}
                                {t.settledToFromTotal > 0 && <div className="text-emerald-600 font-semibold pt-1 border-t border-slate-100">• เคยโอนคืนไปแล้ว: -{t.settledToFromTotal.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</div>}
                              </div>
                            ) : <div className="text-[10px] text-slate-400">ไม่มีหนี้ค้าง</div>}
                          </div>

                          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 shadow-sm text-xs space-y-2">
                            <div className="flex gap-1.5 items-center font-bold text-emerald-800">
                              <Icon name="check_circle" className="text-[14px]"/> สูตรหักลบส่วนต่าง: |-{t.fromOwesToTotal.toLocaleString('th-TH', {minimumFractionDigits:2})} - -{t.toOwesFromTotal.toLocaleString('th-TH', {minimumFractionDigits:2})}| = {t.amount.toLocaleString('th-TH', {minimumFractionDigits:2})} บาท
                            </div>
                            <div className="font-bold text-emerald-700 pl-5">
                              👉 สรุปคือ {t.fromName} โอนให้ {t.toName} เพียง {t.amount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿ จบหนี้ระหว่างคู่นี้ทันที
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm mt-6">
            <div className="flex justify-between items-center mb-5 border-b border-slate-100 pb-3">
              <h3 className="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-2"><Icon name="group" className="text-indigo-600"/> สรุปยอดสถานะของสมาชิกแต่ละคน</h3>
              <span className="text-xs text-slate-500 font-mono bg-slate-50 px-3 py-1 rounded-lg border border-slate-200">ยอดเงินรวม: {settlementData.totalExpense.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {friends.map(f => {
                const b = settlementData.balances[f.id];
                const isPositive = b.net > 0.01;
                const isNegative = b.net < -0.01;
                return (
                  <div key={f.id} className="border border-slate-200 rounded-xl p-4 bg-slate-50/50 hover:bg-white hover:shadow-md transition">
                    <div className="flex justify-between items-start mb-3">
                      <div className="flex items-center gap-2.5">
                        <div className={`w-8 h-8 rounded-full text-white font-bold flex items-center justify-center text-xs shadow-inner ${f.color || 'bg-slate-500'}`}>{f.name.charAt(0)}</div>
                        <span className="font-bold text-slate-800 text-sm">{f.name}</span>
                      </div>
                      <span className={`text-[9px] font-bold px-2 py-1 rounded border ${isPositive ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : isNegative ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
                        {isPositive ? 'ได้รับคืน' : isNegative ? 'ต้องจ่ายออก' : 'ลงตัว'}
                      </span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-500 mb-3 border-y border-slate-100 py-2">
                      <div><span className="block mb-0.5">ออกเงินไป</span><strong className="font-mono text-slate-700 text-xs">{b.totalPaid.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</strong></div>
                      <div><span className="block mb-0.5">กิน/ใช้ไป</span><strong className="font-mono text-slate-700 text-xs">{b.totalOwed.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</strong></div>
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-500 font-medium">ยอดสุทธิ:</span>
                      <span className={`font-mono font-extrabold text-sm ${isPositive ? 'text-emerald-600' : isNegative ? 'text-rose-600' : 'text-slate-700'}`}>
                        {isPositive ? '+' : ''}{b.net.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿
                      </span>
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        </div>
      );
    }

    function CalendarView({ meals, onOpenAddMeal, onViewMeal, onEditMeal, onCopyMeal, onDeleteMeal }) {
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedDateStr, setSelectedDateStr] = useState(new Date().toISOString().split('T')[0]);

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const calendarCells = [];
      for (let i = 0; i < firstDay; i++) calendarCells.push(null);
      for (let i = 1; i <= daysInMonth; i++) calendarCells.push(i);

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthMeals = meals.filter(m => m.date.startsWith(monthPrefix));
      const totalExpense = monthMeals.reduce((s, m) => s + m.finalAmount, 0);
      const mealDaysCount = new Set(monthMeals.map(m => m.date)).size;

      const selectedMeals = meals.filter(m => m.date === selectedDateStr);
      const selDateObj = new Date(selectedDateStr);
      const selDateText = `วัน${THAI_DAYS[selDateObj.getDay()]}ที่ ${selDateObj.getDate()} ${THAI_MONTHS[selDateObj.getMonth()]} พ.ศ. ${selDateObj.getFullYear() + 543}`;

      return (
        <div className="space-y-6 animate-fade-in pb-10">
          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl border border-indigo-100"><Icon name="calendar_month" className="text-2xl"/></div>
                <div>
                  <h2 className="text-xl font-bold text-slate-800">{THAI_MONTHS[month]} พ.ศ. {year + 543} <span className="text-slate-400 text-sm font-mono">({year})</span></h2>
                  <p className="text-xs text-slate-500 mt-0.5">คลิกเลือกวันที่บนปฏิทินเพื่อดูประวัติมื้ออาหาร</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => { setCurrentMonth(new Date()); setSelectedDateStr(new Date().toISOString().split('T')[0]); }} className="px-4 py-2 text-xs font-bold text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-50">วันนี้</button>
                <div className="flex bg-white border border-slate-200 rounded-lg p-1">
                  <button onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="p-1 hover:bg-slate-100 rounded text-slate-500"><Icon name="chevron_left"/></button>
                  <button onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="p-1 hover:bg-slate-100 rounded text-slate-500"><Icon name="chevron_right"/></button>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl"><span className="text-[11px] text-slate-500 font-bold block mb-1">ยอดใช้จ่ายเดือนนี้</span><span className="text-lg font-bold font-mono text-slate-800">{totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</span></div>
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl"><span className="text-[11px] text-slate-500 font-bold block mb-1">จำนวนมื้อในเดือน</span><span className="text-lg font-bold font-mono text-slate-800">{monthMeals.length} มื้อ</span></div>
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl"><span className="text-[11px] text-slate-500 font-bold block mb-1">วันที่ออกไปกินข้าว</span><span className="text-lg font-bold font-mono text-slate-800">{mealDaysCount} วัน</span></div>
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl"><span className="text-[11px] text-slate-500 font-bold block mb-1">เฉลี่ยต่อวัน (ในเดือน)</span><span className="text-lg font-bold font-mono text-slate-800">{(totalExpense / (mealDaysCount || 1)).toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</span></div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
              <div className="md:col-span-7 lg:col-span-8">
                <div className="grid grid-cols-7 gap-2 text-center text-[11px] font-bold text-slate-400 mb-2">
                  <div className="text-rose-500">อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div className="text-indigo-500">ส.</div>
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {calendarCells.map((day, idx) => {
                    if (!day) return <div key={`empty-${idx}`} className="h-20 sm:h-24 p-2 rounded-xl bg-slate-50/50 border border-transparent"></div>;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const isSelected = selectedDateStr === dateStr;
                    const dayMeals = meals.filter(m => m.date === dateStr);
                    const dayTotal = dayMeals.reduce((s, m) => s + m.finalAmount, 0);
                    return (
                      <div key={day} onClick={() => setSelectedDateStr(dateStr)} className={`h-20 sm:h-24 p-2 rounded-xl border ${isSelected ? 'border-indigo-500 bg-indigo-50/30 ring-2 ring-indigo-500/20' : 'border-slate-200 bg-white hover:border-indigo-300'} flex flex-col justify-between cursor-pointer transition-all`}>
                        <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isSelected ? 'bg-indigo-600 text-white' : 'text-slate-600'}`}>{day}</span>
                        {dayMeals.length > 0 && (
                          <div className="space-y-1">
                            <div className="text-[10px] font-bold font-mono text-slate-800 hidden sm:block truncate">{dayTotal.toLocaleString('th-TH')} ฿</div>
                            <div className="flex flex-wrap gap-1">{dayMeals.slice(0, 3).map((_, i) => <div key={i} className="w-1.5 h-1.5 bg-indigo-500 rounded-full"></div>)}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
              
              <div className="md:col-span-5 lg:col-span-4">
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 h-full flex flex-col">
                  <div className="flex justify-between items-start mb-6">
                    <div>
                      <h3 className="text-[11px] text-indigo-600 font-bold mb-0.5">ประวัติมื้ออาหาร</h3>
                      <h4 className="font-bold text-slate-800 text-sm leading-tight">{selDateText}</h4>
                    </div>
                    <button onClick={() => onOpenAddMeal(selectedDateStr)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold shadow-sm flex items-center gap-1 hover:bg-indigo-700 transition shrink-0">
                      <Icon name="add" className="text-[14px]"/> เพิ่มมื้อ
                    </button>
                  </div>
                  <div className="flex-1 overflow-y-auto pr-1 space-y-3 hide-scrollbar">
                    {selectedMeals.length === 0 ? (
                      <div className="bg-white border-2 border-dashed border-slate-200 rounded-xl p-6 text-center text-slate-400 flex flex-col items-center justify-center h-full min-h-[150px]">
                        <span className="text-3xl mb-2">🍽️</span><p className="font-bold text-sm text-slate-600">ไม่มีรายการอาหารในวันนี้</p><p className="text-[10px] mt-1">คลิกปุ่ม "เพิ่มมื้อ" เพื่อบันทึกบิล</p>
                      </div>
                    ) : (
                      selectedMeals.map(m => (
                        <div key={m.id} className="bg-white rounded-xl border border-slate-200 p-3 shadow-sm flex flex-col justify-between">
                          <div className="flex justify-between items-start mb-2 cursor-pointer hover:underline" onClick={() => onViewMeal(m)}>
                            <h5 className="font-bold text-slate-800 text-sm truncate pr-2">{m.title}</h5>
                            <span className="font-mono font-bold text-indigo-600 text-sm whitespace-nowrap">{m.finalAmount.toLocaleString('th-TH')} ฿</span>
                          </div>
                          <div className="text-[10px] text-slate-500 mb-3">คนหาร: {m.participants.length} คน</div>
                          <div className="flex justify-end gap-1.5 pt-2 border-t border-slate-100">
                            <button onClick={() => onViewMeal(m)} className="px-2 py-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-md text-[10px] font-bold hover:bg-slate-100"><Icon name="visibility" className="text-[12px]"/> ดู</button>
                            <button onClick={() => onEditMeal(m)} className="p-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-md hover:text-indigo-600"><Icon name="edit" className="text-[14px]"/></button>
                            <button onClick={() => onCopyMeal(m)} className="p-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-md hover:text-slate-900"><Icon name="content_copy" className="text-[14px]"/></button>
                            <button onClick={() => onDeleteMeal(m.id)} className="p-1 bg-slate-50 border border-slate-200 text-rose-500 rounded-md hover:bg-rose-50"><Icon name="delete" className="text-[14px]"/></button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function MealsView({ meals, friends, categories, onViewMeal, onEditMeal, onCopyMeal, onDeleteMeal }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [sortBy, setSortBy] = useState('date_desc');

      const filteredMeals = useMemo(() => {
        let result = meals;
        if (searchTerm) {
          const lower = searchTerm.toLowerCase();
          result = result.filter(m => m.title.toLowerCase().includes(lower) || friends.find(f => f.id === m.payerId)?.name.toLowerCase().includes(lower));
        }
        if (filterCat !== 'all') result = result.filter(m => m.categoryId === filterCat);
        result.sort((a, b) => {
          if (sortBy === 'date_desc') return b.date.localeCompare(a.date);
          if (sortBy === 'date_asc') return a.date.localeCompare(b.date);
          if (sortBy === 'amt_desc') return b.finalAmount - a.finalAmount;
          if (sortBy === 'amt_asc') return a.finalAmount - b.finalAmount;
          return 0;
        });
        return result;
      }, [meals, searchTerm, filterCat, sortBy, friends]);

      return (
        <div className="space-y-4 animate-fade-in pb-10">
          <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center gap-3">
            <div className="flex-1 flex items-center gap-2 px-3 py-2 bg-slate-50 rounded-xl border border-slate-100 focus-within:border-indigo-300 focus-within:bg-white transition-colors">
              <Icon name="search" className="text-slate-400" />
              <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="ค้นหาชื่อร้าน, สถานที่, หรือชื่อเพื่อน..." className="w-full text-sm outline-none bg-transparent text-slate-700" />
            </div>
            <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-600 p-2.5 rounded-xl outline-none cursor-pointer">
              <option value="date_desc">เรียงตาม: วันที่ล่าสุด</option>
              <option value="date_asc">เรียงตาม: วันที่เก่าสุด</option>
              <option value="amt_desc">เรียงตาม: ยอดเงินสูงสุด</option>
              <option value="amt_asc">เรียงตาม: ยอดเงินต่ำสุด</option>
            </select>
          </div>

          <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
            <button onClick={() => setFilterCat('all')} className={`px-4 py-2 text-xs font-bold rounded-full shadow-sm whitespace-nowrap transition-colors ${filterCat === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>ทั้งหมด ({meals.length})</button>
            {categories.map(c => {
              const count = meals.filter(m => m.categoryId === c.id).length;
              if(count === 0) return null;
              return <button key={c.id} onClick={() => setFilterCat(c.id)} className={`px-4 py-2 text-xs font-semibold rounded-full whitespace-nowrap transition-colors ${filterCat === c.id ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>{c.label} ({count})</button>
            })}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
            {filteredMeals.map(m => {
              const payer = friends.find(f => f.id === m.payerId);
              const parts = m.participants.map(p => friends.find(f=>f.id===p.friendId));
              const cat = categories.find(c => c.id === m.categoryId) || DEFAULT_CATEGORIES[0];
              
              return (
                <div key={m.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-300 transition-colors p-5 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <span className={`text-[10px] font-semibold px-2.5 py-0.5 rounded-full border ${cat.color || 'bg-slate-50 text-slate-600 border-slate-200'}`}>{cat.label}</span>
                      <div className="flex items-center gap-1.5 text-xs text-slate-500 font-mono"><Icon name="calendar_today" className="text-[14px] text-slate-400"/> {m.date}</div>
                    </div>
                    <h4 className="font-bold text-slate-800 text-lg mb-4 line-clamp-2">{m.title}</h4>
                    <div className="flex items-center gap-4 text-xs text-slate-500 mb-4">
                      <p>คนจ่าย: <strong className="text-indigo-600">{payer?.name || '?'}</strong></p>
                      <div className="flex items-center gap-1.5">
                        <span>คนหาร ({parts.length}):</span>
                        <div className="flex -space-x-1">
                          {parts.slice(0,3).map((p, i) => <div key={i} className={`w-5 h-5 rounded-full text-white flex items-center justify-center text-[9px] font-bold border border-white ${p?.color || 'bg-slate-400'}`}>{p?.name?.charAt(0) || '?'}</div>)}

    function AddMealModal({ isOpen, onClose, initialData, friends, categories, openCategoryManager, onSubmit }) {
      const [amount, setAmount] = useState('');
      const [discount, setDiscount] = useState('');
      const [hasVat, setHasVat] = useState(false);
      const [hasSc, setHasSc] = useState(false);
      const [rounding, setRounding] = useState('actual');
      const [payerId, setPayerId] = useState('');
      const [participants, setParticipants] = useState({});

      useEffect(() => {
        if (isOpen) {
          const initialParts = {};
          if (initialData && initialData.participants) {
            friends.forEach(f => initialParts[f.id] = false);
            initialData.participants.forEach(p => initialParts[p.friendId] = true);
            setAmount(initialData.baseAmount || '');
            setDiscount(initialData.discount || '');
            setHasVat(initialData.hasVat || false);
            setHasSc(initialData.hasServiceCharge || false);
            setRounding(initialData.roundingMode || 'actual');
            setPayerId(initialData.payerId || '');
          } else {
            friends.forEach(f => initialParts[f.id] = true);
            setAmount(''); setDiscount(''); setHasVat(false); setHasSc(false); setRounding('actual'); setPayerId('');
          }
          setParticipants(initialParts);
        }
      }, [isOpen, friends, initialData]);

      if (!isOpen) return null;

      const baseAmount = parseFloat(amount) || 0;
      const discountAmt = parseFloat(discount) || 0;
      let calcFinal = baseAmount - discountAmt;
      if (hasSc) calcFinal += (calcFinal * 0.10);
      if (hasVat) calcFinal += (calcFinal * 0.07);

      const activeCount = Object.values(participants).filter(Boolean).length;
      let splitAmountRaw = activeCount > 0 ? (calcFinal / activeCount) : 0;
      
      let splitAmount = splitAmountRaw;
      if (rounding === 'ceil') splitAmount = Math.ceil(splitAmountRaw);
      else if (rounding === 'round') splitAmount = Math.round(splitAmountRaw);
      else if (rounding === 'floor') splitAmount = Math.floor(splitAmountRaw);

      const adjustedFinal = splitAmount * activeCount;

      const toggleParticipant = (id) => setParticipants(prev => ({ ...prev, [id]: !prev[id] }));
      const selectAll = () => { const next = {}; friends.forEach(f => next[f.id] = true); setParticipants(next); };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={initialData?.id ? "แก้ไขมื้ออาหาร" : "บันทึกมื้ออาหารใหม่"} fullWidth>
          <form key={initialData?.id || 'new'} onSubmit={onSubmit} className="bg-slate-50 p-4 sm:p-5 rounded-b-2xl space-y-5">
            <input type="hidden" name="rounding" value={rounding} />
            <div className="space-y-4 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อร้าน / มื้ออาหาร <span className="text-slate-400 font-normal">(ไม่ระบุก็ได้)</span></label>
                <input name="title" defaultValue={initialData?.title || ''} placeholder="เช่น ข้าวมันไก่, ชาบู หรือระบุยอดอย่างเดียวได้เลย" className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 text-sm bg-slate-50" required />
              </div>
              <div className="flex gap-3">
                <div className="w-1/2">
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">วันที่</label>
                  <input type="date" name="date" defaultValue={initialData?.date || new Date().toISOString().split('T')[0]} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm text-slate-600 bg-slate-50" required />
                </div>
                <div className="w-1/2">
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="text-xs font-bold text-slate-700">หมวดหมู่</label>
                    <button type="button" onClick={openCategoryManager} className="text-[10px] text-indigo-600 font-bold flex items-center gap-0.5 hover:underline"><Icon name="sell" className="text-[12px]"/> จัดการหมวดหมู่</button>
                  </div>
                  <select name="category" defaultValue={initialData?.categoryId || categories[0]?.id} className="w-full p-3 rounded-xl border border-slate-200 outline-none bg-slate-50 focus:border-indigo-500 text-sm">
                    {categories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </div>
              </div>
              <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-4">
                <div className="flex justify-between items-end gap-3">
                  <div className="w-1/2">
                    <label className="text-xs font-bold text-rose-600 mb-1.5 block">ยอดเงินรวม (บาท) *</label>
                    <input 
                      name="amount" 
                      type="text" 
                      inputMode="decimal" 
                      value={amount} 
                      onChange={e => setAmount(e.target.value.replace(/[^0-9.]/g, ''))} 
                      placeholder="0.00" 
                      className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-indigo-500 font-mono font-bold text-lg text-slate-800" 
                      required 
                    />
                  </div>
                  <div className="w-1/2 flex flex-col justify-end">
                    <div className="flex items-center gap-3 mb-2 text-[11px] sm:text-xs font-semibold text-slate-600">
                      <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="hasServiceCharge" checked={hasSc} onChange={e=>setHasSc(e.target.checked)} className="w-3.5 h-3.5 text-indigo-600 rounded" /> + Service 10%</label>
                      <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="hasVat" checked={hasVat} onChange={e=>setHasVat(e.target.checked)} className="w-3.5 h-3.5 text-indigo-600 rounded" /> + VAT 7%</label>
                    </div>
                    <input 
                      name="discount" 
                      type="text" 
                      inputMode="decimal" 
                      value={discount} 
                      onChange={e => setDiscount(e.target.value.replace(/[^0-9.]/g, ''))} 
                      placeholder="ส่วนลด (ถ้ามี)" 
                      className="w-full p-2.5 rounded-lg border border-slate-300 outline-none focus:border-indigo-500 text-sm font-mono" 
                    />
                  </div>
                </div>
                <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-100 gap-2">
                  <div className="flex items-center gap-1.5 text-indigo-700 text-xs font-bold"><Icon name="balance" className="text-[16px]"/> ระบบปัดเศษเงินที่หาร:</div>
                  <div className="flex gap-1 text-[11px] font-semibold">
                    <button type="button" onClick={()=>setRounding('actual')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'actual' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ตามจริง</button>
                    <button type="button" onClick={()=>setRounding('ceil')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'ceil' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ปัดขึ้น</button>
                    <button type="button" onClick={()=>setRounding('round')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'round' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ปัดปกติ</button>
                    <button type="button" onClick={()=>setRounding('floor')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'floor' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ปัดลง</button>
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-bold text-slate-800 flex items-center gap-1.5"><Icon name="account_balance_wallet" className="text-amber-600 text-[18px]"/> ใครเป็นคนสำรองจ่ายเงิน?</label>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {friends.map(f => (
                  <label key={f.id} className="cursor-pointer">
                    <input type="radio" name="payerId" value={f.id} checked={payerId === f.id} onChange={(e) => setPayerId(e.target.value)} className="peer sr-only" required />
                    <div className="p-2.5 rounded-xl border border-slate-200 bg-white flex items-center gap-2 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:ring-1 peer-checked:ring-indigo-600 transition">
                      <div className={`w-6 h-6 rounded-md text-white font-bold flex items-center justify-center text-xs ${f.color || 'bg-slate-500'}`}>{f.name.charAt(0)}</div>
                      <span className="text-xs font-bold text-slate-700 truncate">{f.name}</span>
                    </div>
                  </label>
                ))}
                {friends.length === 0 && <p className="text-xs text-rose-500 col-span-full">กรุณาเพิ่มเพื่อนในแท็บ 'เพื่อน' ก่อน</p>}
              </div>
            </div>

            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-bold text-slate-800 flex items-center gap-1.5"><Icon name="restaurant" className="text-rose-500 text-[18px]"/> เลือกคนกินที่ต้องหารมื้อนี้:</label>
                <button type="button" onClick={selectAll} className="text-[11px] text-indigo-600 font-bold hover:underline">เลือกทุกคน</button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                {friends.map(f => {
                  const isChecked = participants[f.id];
                  const isPayer = payerId === f.id;
                  const paidAmount = isPayer ? adjustedFinal : 0;
                  const owedAmount = isChecked ? splitAmount : 0;
                  const net = paidAmount - owedAmount;
                  
                  return (
                    <div key={f.id} onClick={() => toggleParticipant(f.id)} className={`p-3 rounded-xl border cursor-pointer flex flex-col justify-between transition ${isChecked ? 'bg-indigo-50/40 border-indigo-300' : 'bg-white border-slate-200 opacity-60 hover:opacity-100'}`}>
                      <input type="checkbox" name="participants" value={f.id} checked={isChecked} onChange={() => {}} className="hidden" />
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <div className={`w-4 h-4 rounded border flex items-center justify-center ${isChecked ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300 bg-white'}`}>
                            {isChecked && <Icon name="check" className="text-white text-[12px]"/>}
                          </div>
                          <span className="text-sm font-bold text-slate-800 truncate max-w-[80px]">{f.name}</span>
                        </div>
                        <span className={`text-[11px] font-mono font-bold ${isChecked ? 'text-indigo-700' : 'text-slate-400'}`}>ค่ากิน {owedAmount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                      </div>
                      <div className="flex justify-between items-center pt-2 border-t border-slate-200/60 text-[10px] text-slate-500">
                        <span>{isPayer ? <span className="text-rose-600 font-semibold">จ่ายออก {adjustedFinal.toLocaleString()} ฿</span> : 'ไม่ได้จ่ายออก'}</span>
                        <span className={`font-bold px-2 py-0.5 rounded ${net > 0 ? 'bg-emerald-100 text-emerald-700' : net < 0 ? 'bg-rose-100 text-rose-700' : 'bg-slate-200 text-slate-600'}`}>
                          {net > 0 ? `ได้คืน +${net.toLocaleString()}` : net < 0 ? `จ่ายเพิ่ม ${Math.abs(net).toLocaleString()}` : 'พอดี 0 ฿'}
                        </span>
                      </div>
                    </div>
                  )
                })}
              </div>
            </div>
            
            <div className="flex gap-3 pt-2">
              <button type="button" onClick={onClose} className="w-1/3 bg-white border border-slate-300 text-slate-700 font-bold py-3.5 rounded-xl text-sm hover:bg-slate-50 transition">ยกเลิก</button>

                <Icon name="check_circle" className="text-[18px]"/> {initialData?.id ? 'บันทึกการแก้ไข' : 'บันทึกบิลอาหาร'}

    function AddDebtModal({ isOpen, onClose, initialData, friends, onSubmit }) {
      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [creditorId, setCreditorId] = useState('');
      const [debtors, setDebtors] = useState({});
      const [includeInAutoSettle, setIncludeInAutoSettle] = useState(true);

      useEffect(() => {
        if (isOpen) {
          if (initialData) {
            setTitle(initialData.title || '');
            setAmount(initialData.baseAmount || '');
            setDate(initialData.date || new Date().toISOString().split('T')[0]);
            setCreditorId(initialData.payerId || '');
            setIncludeInAutoSettle(initialData.includeInAutoSettle !== false);
            const initialParts = {};
            friends.forEach(f => initialParts[f.id] = false);
            if (initialData.participants) initialData.participants.forEach(p => initialParts[p.friendId] = true);
            setDebtors(initialParts);
          } else {
            setTitle(''); setAmount(''); setDate(new Date().toISOString().split('T')[0]);
            setCreditorId(''); setIncludeInAutoSettle(true);
            const initialParts = {};
            friends.forEach(f => initialParts[f.id] = false);
            setDebtors(initialParts);
          }
        }
      }, [isOpen, initialData, friends]);

      if (!isOpen) return null;

      const toggleDebtor = (id) => setDebtors(prev => ({ ...prev, [id]: !prev[id] }));

      const handleSubmit = (e) => {
        e.preventDefault();
        const activeDebtors = Object.keys(debtors).filter(id => debtors[id]);
        if (!amount || !creditorId || activeDebtors.length === 0) {
          alert('กรุณาระบุยอดเงิน เจ้าหนี้ และลูกหนี้ให้ครบถ้วน');
          return;
        }
        
        const finalAmount = parseFloat(amount);

          payerId: creditorId, participants,
          splitMode: 'equal', roundingMode: 'actual',
          isCustomDebt: true, includeInAutoSettle
        };
        onSubmit(data, initialData?.id);

    function CategoryManagerModal({ isOpen, onClose, categories, showConfirm }) {
      const [newCat, setNewCat] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editLabel, setEditLabel] = useState('');

      const handleAdd = async (e) => {
        e.preventDefault();
        if (newCat.trim()) {
          await db.collection('categories').add({
            label: newCat.trim(),
            color: 'bg-slate-50 text-slate-700 border-slate-200', // สีพื้นฐานสำหรับอันที่สร้างใหม่
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewCat('');
        }
      };

      const handleEdit = async (e) => {
        e.preventDefault();
        if (editLabel.trim() && editingId) {
          await db.collection('categories').doc(editingId).set({
            label: editLabel.trim(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          setEditingId(null);
        }
      };

      const handleDelete = (id) => {
        if (showConfirm) {
          showConfirm('ยืนยันการลบ', 'ลบหมวดหมู่นี้ใช่หรือไม่?', async () => {
            await db.collection('categories').doc(id).delete();
            setEditingId(null);
          }, 'ลบทิ้ง', 'bg-rose-600 hover:bg-rose-700');
        } else {
          if(confirm('ลบหมวดหมู่นี้?')) {
            db.collection('categories').doc(id).delete();
            setEditingId(null);
          }
        }
      };

      if (!isOpen) return null;

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="จัดการหมวดหมู่อาหาร">
          <div className="p-5 space-y-4">
            <form onSubmit={handleAdd} className="flex gap-2">
              <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="ชื่อหมวดหมู่ใหม่ เช่น ซูชิ" className="flex-1 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-indigo-500 bg-slate-50"/>
              <button type="submit" disabled={!newCat} className="bg-indigo-600 text-white px-5 rounded-xl font-bold text-sm flex items-center gap-1 disabled:opacity-50 hover:bg-indigo-700 transition"><Icon name="add" className="text-[18px]"/> เพิ่ม</button>
            </form>
            
            <div className="mt-6">
              <h3 className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">รายการหมวดหมู่ทั้งหมด</h3>
              <div className="space-y-2 max-h-60 overflow-y-auto pr-1 hide-scrollbar">
                {categories.map(c => (
                  <div key={c.id} className="flex justify-between items-center p-3 border border-slate-200 rounded-xl bg-white shadow-sm min-h-[52px]">
                    {editingId === c.id ? (
                      <form onSubmit={handleEdit} className="flex gap-2 w-full">
                        <input value={editLabel} onChange={e=>setEditLabel(e.target.value)} className="flex-1 p-1.5 border border-slate-300 rounded text-sm outline-none focus:border-indigo-500" autoFocus />
                        <button type="submit" className="text-xs bg-indigo-600 text-white px-3 rounded font-bold hover:bg-indigo-700 transition">บันทึก</button>
                        <button type="button" onClick={()=>setEditingId(null)} className="text-xs bg-slate-100 text-slate-600 px-3 rounded font-bold hover:bg-slate-200 transition">ยกเลิก</button>
                      </form>
                    ) : (
                      <>
                        <span className="text-sm font-bold text-slate-800">{c.label}</span>
                        <div className="flex gap-1 text-slate-400">
                          <button onClick={() => { setEditingId(c.id); setEditLabel(c.label); }} className="p-1 hover:text-indigo-600 transition"><Icon name="edit" className="text-[18px]"/></button>
                          <button onClick={() => handleDelete(c.id)} className="p-1 hover:text-rose-600 transition"><Icon name="delete" className="text-[18px]"/></button>
                        </div>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>

            <div className="pt-4 flex justify-end border-t border-slate-100">
              <button onClick={onClose} className="px-6 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition">เสร็จสิ้น</button>
            </div>
          </div>
        </Modal>
      );
    }

                        <div className="flex justify-between font-bold text-slate-800 mb-1.5">
                          <span className="truncate pr-2">• {m.title}</span>
                          <span className="font-mono text-indigo-700 shrink-0">{m.finalAmount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                        </div>
                        <div className="flex justify-between text-slate-500">
                          <span>จ่ายโดย: <strong className="text-slate-700">{payerName}</strong></span>
                          <span>(คนละ {perPerson.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿)</span>
                        </div>
                      </div>
                    )
                  })}
                  {settlementData.activeMealsList.length === 0 && <div className="text-xs text-slate-400">ไม่มีรายการ</div>}
                </div>

                <div className="mt-8 text-center text-[9px] text-slate-400 font-mono">สร้างด้วยระบบหารค่าข้าว MealSplit TH</div>
              </div>
            </div>

            <div className="w-full flex gap-3 mt-4">
              <button onClick={onClose} className="px-6 py-3.5 rounded-xl border border-slate-300 font-bold text-sm text-slate-700 bg-white hover:bg-slate-50 transition shadow-sm">ปิด</button>
              <button onClick={handleDownload} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 transition">
                <Icon name="file_download"/> ดาวน์โหลดรูปภาพ
              </button>
            </div>
          </div>
        </Modal>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
