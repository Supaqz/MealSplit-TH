<body>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
      projectId: "mealsplit-th",
      appId: "1:575865319667:web:df3d76a11f4f944656c786",
      apiKey: "AIzaSyDDPQOrGwIj7ggnzGpDfiNW612fVLGt0HU",
      authDomain: "mealsplit-th.firebaseapp.com",
      storageBucket: "mealsplit-th.firebasestorage.app",
      messagingSenderId: "575865319667",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DEFAULT_CATEGORIES = [
      { id: 'general', label: 'มื้ออาหารทั่วไป', icon: '🍽️', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      { id: 'shabu', label: 'อาหารจานเดียว/ตามสั่ง', icon: '🍛', color: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'cafe', label: 'คาเฟ่/ของหวาน', icon: '☕', color: 'bg-rose-50 text-rose-700 border-rose-200' },
      { id: 'party', label: 'ปาร์ตี้/แอลกอฮอล์', icon: '🍻', color: 'bg-purple-50 text-purple-700 border-purple-200' },
    ];

    const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const THAI_DAYS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

    // ==========================================
    // 2. HELPER LOGIC
    // ==========================================
    function generatePromptPayPayload(target, amount) {
      target = target ? target.replace(/[^0-9]/g, '') : '';
      if (!target) return "";
      const targetType = target.length >= 15 ? '03' : target.length >= 13 ? '02' : '01';
      const formattedTarget = target.length >= 13 ? target : ("0000000000000" + target.replace(/^0/, "66")).slice(-13);
      let data = [
        "000201", "010211", "29370016A000000677010111", targetType, 
        formattedTarget.length.toString().padStart(2, '0'), formattedTarget, "5802TH", "5303764"
      ];
      if (amount > 0) {
        const amtStr = amount.toFixed(2);
        data.push("54" + amtStr.length.toString().padStart(2, '0') + amtStr);
      }
      data.push("6304");
      let payload = data.join("");
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function calculateSettlement(meals, friends, settledDebts) {
      const balances = {};
      friends.forEach(f => balances[f.id] = { ...f, totalPaid: 0, totalOwed: 0, net: 0 });

      let totalExpense = 0;
      meals.forEach(m => {
        totalExpense += m.finalAmount;
        if(balances[m.payerId]) {
          balances[m.payerId].totalPaid += m.finalAmount;
          balances[m.payerId].net += m.finalAmount;
        }
        m.participants.forEach(p => {
          if(balances[p.friendId]) {
            balances[p.friendId].totalOwed += p.amount;
            balances[p.friendId].net -= p.amount;
          }
        });
      });

      settledDebts.forEach(s => {
        if(balances[s.fromId] && balances[s.toId]) {
          balances[s.fromId].net += s.amount;
          balances[s.toId].net -= s.amount;
        }
      });

      let debtors = [], creditors = [];
      Object.values(balances).forEach(b => {
        b.net = Math.round(b.net * 100) / 100;
        if (b.net < -0.01) debtors.push({ ...b, amount: Math.abs(b.net) });
        else if (b.net > 0.01) creditors.push({ ...b, amount: b.net });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transfers = [];
      let d = 0, c = 0;
      while (d < debtors.length && c < creditors.length) {
        const debtor = debtors[d];
        const creditor = creditors[c];
        const minAmount = Math.min(debtor.amount, creditor.amount);
        if (minAmount > 0.01) {
          transfers.push({
            id: `tr_${debtor.id}_${creditor.id}_${Date.now()}`,
            fromId: debtor.id, fromName: debtor.name, fromColor: debtor.color,
            toId: creditor.id, toName: creditor.name, toColor: creditor.color,
            amount: minAmount, promptPay: creditor.promptPay,
            bankName: creditor.bankName, bankAccount: creditor.bankAccount
          });
        }
        debtor.amount -= minAmount;
        creditor.amount -= minAmount;
        if (debtor.amount <= 0.01) d++;
        if (creditor.amount <= 0.01) c++;
      }
      return { totalExpense, transfers, balances };
    }

    // ==========================================
    // 3. REUSABLE UI COMPONENTS
    // ==========================================
    const Icon = ({ name, className }) => <span className={`material-icons-round ${className}`}>{name}</span>;

    const Modal = ({ isOpen, onClose, title, children, fullWidth = false, noPadding = false }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in">
          <div className={`bg-white rounded-2xl w-full ${fullWidth ? 'max-w-4xl' : 'max-w-lg'} shadow-2xl overflow-hidden flex flex-col max-h-[95vh] relative`}>
            {title && (
              <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50/80">
                <h2 className="font-bold text-slate-800 text-lg flex items-center gap-2">{title}</h2>
                <button onClick={onClose} className="text-slate-400 hover:text-rose-500 font-bold p-1 rounded-lg hover:bg-slate-200 transition"><Icon name="close" className="text-xl"/></button>
              </div>
            )}
            <div className={`${noPadding ? '' : 'p-0'} overflow-y-auto hide-scrollbar flex-1 bg-white relative`}>
              {!title && <button onClick={onClose} className="absolute top-4 right-4 z-10 text-slate-400 hover:text-white bg-slate-100/20 hover:bg-slate-800/50 rounded-full p-1 transition"><Icon name="close" className="text-xl"/></button>}
              {children}
            </div>
          </div>
        </div>
      );
    };

    function PromptPayQR({ promptPay, amount }) {
      const [src, setSrc] = useState('');
      useEffect(() => {
        const payload = generatePromptPayPayload(promptPay, amount);
        if (payload) {
          QRCode.toDataURL(payload, { margin: 1, scale: 6, color: { dark: '#1e293b', light: '#ffffff' } }, (err, url) => {
            if (!err) setSrc(url);
          });
        }
      }, [promptPay, amount]);
      if (!src) return <div className="text-xs text-slate-500 bg-slate-50 p-6 rounded-xl text-center border border-slate-200 border-dashed w-48 h-48 flex items-center justify-center">ไม่มีพร้อมเพย์</div>;
      return <img src={src} alt="QR" className="w-48 h-48 mx-auto rounded-xl shadow-sm border border-slate-200 p-2" />;
    }

    // ==========================================
    // 4. SUB-VIEWS
    // ==========================================
    function CalendarView({ meals, categories, friends, onOpenAddMeal, onEditMeal, onCopyMeal, onDeleteMeal, onViewMeal }) {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);

      // Calculate Calendar Data
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const calendarCells = [];
      // Empty cells for previous month
      for (let i = 0; i < firstDayOfMonth; i++) calendarCells.push(null);
      // Days of current month
      for (let i = 1; i <= daysInMonth; i++) calendarCells.push(i);

      // Current Month Stats
      const currentMonthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthMeals = meals.filter(m => m.date.startsWith(currentMonthPrefix));
      const totalExpense = monthMeals.reduce((sum, m) => sum + m.finalAmount, 0);
      const mealDaysCount = new Set(monthMeals.map(m => m.date)).size;

      // Selected Date Meals
      const selectedMeals = meals.filter(m => m.date === selectedDate);
      const selectedDateObj = new Date(selectedDate);
      const selectedDateText = `วัน${THAI_DAYS[selectedDateObj.getDay()]}ที่ ${selectedDateObj.getDate()} ${THAI_MONTHS[selectedDateObj.getMonth()]} พ.ศ. ${selectedDateObj.getFullYear() + 543}`;

      const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));
      const handleToday = () => {
        const today = new Date();
        setCurrentDate(today);
        setSelectedDate(today.toISOString().split('T')[0]);
      };

      const handleDayClick = (day) => {
        if (!day) return;
        const clickedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        setSelectedDate(clickedDate);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl border border-indigo-100"><Icon name="calendar_month" className="text-2xl"/></div>
                <div>
                  <h2 className="text-xl font-bold text-slate-800">{THAI_MONTHS[month]} พ.ศ. {year + 543} <span className="text-slate-400 text-sm font-mono">({year})</span></h2>
                  <p className="text-xs text-slate-500 mt-0.5">คลิกเลือกวันที่บนปฏิทินเพื่อดูประวัติมื้ออาหาร</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={handleToday} className="px-4 py-2 text-xs font-bold text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-50">วันนี้</button>
                <div className="flex bg-white border border-slate-200 rounded-lg p-1">
                  <button onClick={handlePrevMonth} className="p-1 hover:bg-slate-100 rounded text-slate-500"><Icon name="chevron_left"/></button>
                  <button onClick={handleNextMonth} className="p-1 hover:bg-slate-100 rounded text-slate-500"><Icon name="chevron_right"/></button>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl">
                <span className="text-[11px] text-slate-500 font-bold block mb-1">ยอดใช้จ่ายเดือนนี้</span>
                <span className="text-lg font-bold font-mono text-slate-800">{totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</span>
              </div>
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl">
                <span className="text-[11px] text-slate-500 font-bold block mb-1">จำนวนมื้อในเดือน</span>
                <span className="text-lg font-bold font-mono text-slate-800">{monthMeals.length} มื้อ</span>
              </div>
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl">
                <span className="text-[11px] text-slate-500 font-bold block mb-1">วันที่ออกไปกินข้าว</span>
                <span className="text-lg font-bold font-mono text-slate-800">{mealDaysCount} วัน</span>
              </div>
              <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl">
                <span className="text-[11px] text-slate-500 font-bold block mb-1">เฉลี่ยต่อวัน (ในเดือน)</span>
                <span className="text-lg font-bold font-mono text-slate-800">{(totalExpense / (mealDaysCount || 1)).toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</span>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
              {/* Calendar Grid */}
              <div className="md:col-span-7 lg:col-span-8">
                <div className="grid grid-cols-7 gap-2 text-center text-[11px] font-bold text-slate-400 mb-2">
                  <div className="text-rose-500">อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div className="text-indigo-500">ส.</div>
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {calendarCells.map((day, idx) => {
                    if (!day) return <div key={`empty-${idx}`} className="h-20 sm:h-24 p-2 rounded-xl bg-slate-50/50 border border-transparent"></div>;
                    
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const isSelected = selectedDate === dateStr;
                    const dayMeals = meals.filter(m => m.date === dateStr);
                    const dayTotal = dayMeals.reduce((s, m) => s + m.finalAmount, 0);

                    return (
                      <div key={day} onClick={() => handleDayClick(day)} className={`h-20 sm:h-24 p-2 rounded-xl border ${isSelected ? 'border-indigo-500 bg-indigo-50/30 ring-2 ring-indigo-500/20' : 'border-slate-200 bg-white hover:border-indigo-300'} flex flex-col justify-between cursor-pointer transition-all`}>
                        <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isSelected ? 'bg-indigo-600 text-white' : 'text-slate-600'}`}>{day}</span>
                        {dayMeals.length > 0 && (
                          <div className="space-y-1">
                            <div className="text-[10px] font-bold font-mono text-slate-800 hidden sm:block truncate">{dayTotal.toLocaleString('th-TH')} ฿</div>
                            <div className="flex flex-wrap gap-1">
                              {dayMeals.slice(0, 3).map((_, i) => <div key={i} className="w-1.5 h-1.5 bg-indigo-500 rounded-full"></div>)}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
              
              {/* Daily Details */}
              <div className="md:col-span-5 lg:col-span-4">
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 h-full flex flex-col">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <h3 className="text-[11px] text-indigo-600 font-bold mb-0.5">ประวัติมื้ออาหาร</h3>
                      <h4 className="font-bold text-slate-800 text-sm leading-tight">{selectedDateText}</h4>
                    </div>
                    <button onClick={() => onOpenAddMeal(selectedDate)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold shadow-sm flex items-center gap-1 hover:bg-indigo-700 transition shrink-0">
                      <Icon name="add" className="text-[14px]"/> เพิ่มมื้อ
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto pr-1 space-y-3">
                    {selectedMeals.length === 0 ? (
                      <div className="bg-white border-2 border-dashed border-slate-200 rounded-xl p-6 text-center text-slate-400 flex flex-col items-center justify-center h-full min-h-[150px]">
                        <span className="text-3xl mb-2">🍽️</span>
                        <p className="font-bold text-sm text-slate-600">ไม่มีรายการอาหารในวันนี้</p>
                        <p className="text-[10px] mt-1">คลิกปุ่ม "เพิ่มมื้อ" เพื่อบันทึกบิล</p>
                      </div>
                    ) : (
                      selectedMeals.map(m => {
                        const payer = friends.find(f => f.id === m.payerId);
                        return (
                          <div key={m.id} className="bg-white rounded-xl border border-slate-200 p-3 shadow-sm">
                            <div className="flex justify-between items-start mb-2">
                              <h5 className="font-bold text-slate-800 text-sm truncate pr-2">{m.title}</h5>
                              <span className="font-mono font-bold text-indigo-600 text-sm whitespace-nowrap">{m.finalAmount.toLocaleString('th-TH')} ฿</span>
                            </div>
                            <div className="text-[10px] text-slate-500 mb-3">
                              จ่ายโดย: <strong className="text-slate-700">{payer?.name || '?'}</strong> | คนหาร: {m.participants.length} คน
                            </div>
                            <div className="flex justify-end gap-1.5 pt-2 border-t border-slate-100">
                              <button onClick={() => onViewMeal(m)} className="px-2 py-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-md text-[10px] font-bold hover:bg-slate-100"><Icon name="visibility" className="text-[12px]"/> ดู</button>
                              <button onClick={() => onEditMeal(m)} className="p-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-md hover:text-indigo-600"><Icon name="edit" className="text-[14px]"/></button>
                              <button onClick={() => onCopyMeal(m)} className="p-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-md hover:text-slate-900"><Icon name="content_copy" className="text-[14px]"/></button>
                              <button onClick={() => onDeleteMeal(m.id)} className="p-1 bg-slate-50 border border-slate-200 text-rose-500 rounded-md hover:bg-rose-50"><Icon name="delete" className="text-[14px]"/></button>
                            </div>
                          </div>
                        )
                      })
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function MealsView({ meals, friends, categories, onOpenAddMeal, onEditMeal, onCopyMeal, onDeleteMeal, onViewMeal }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [sortBy, setSortBy] = useState('date_desc');

      // กรองและเรียงลำดับ
      const filteredMeals = useMemo(() => {
        let result = meals;
        // ค้นหา
        if (searchTerm) {
          const lower = searchTerm.toLowerCase();
          result = result.filter(m => m.title.toLowerCase().includes(lower) || friends.find(f => f.id === m.payerId)?.name.toLowerCase().includes(lower));
        }
        // หมวดหมู่
        if (filterCat !== 'all') {
          result = result.filter(m => m.categoryId === filterCat);
        }
        // เรียงลำดับ
        result.sort((a, b) => {
          if (sortBy === 'date_desc') return b.date.localeCompare(a.date);
          if (sortBy === 'date_asc') return a.date.localeCompare(b.date);
          if (sortBy === 'amt_desc') return b.finalAmount - a.finalAmount;
          if (sortBy === 'amt_asc') return a.finalAmount - b.finalAmount;
          return 0;
        });
        return result;
      }, [meals, searchTerm, filterCat, sortBy, friends]);

      return (
        <div className="space-y-4 animate-fade-in">
          {/* Search Bar & Filters */}
          <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center gap-3">
            <div className="flex-1 flex items-center gap-2 px-3 py-2 bg-slate-50 rounded-xl border border-slate-100 focus-within:border-indigo-300 focus-within:bg-white transition-colors">
              <Icon name="search" className="text-slate-400" />
              <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="ค้นหาชื่อร้าน, สถานที่, หรือชื่อเพื่อน..." className="w-full text-sm outline-none bg-transparent text-slate-700" />
            </div>
            <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-600 p-2.5 rounded-xl outline-none cursor-pointer">
              <option value="date_desc">เรียงตาม: วันที่ล่าสุด</option>
              <option value="date_asc">เรียงตาม: วันที่เก่าสุด</option>
              <option value="amt_desc">เรียงตาม: ยอดเงินสูงสุด</option>
              <option value="amt_asc">เรียงตาม: ยอดเงินต่ำสุด</option>
            </select>
          </div>

          {/* Category Filter */}
          <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
            <button onClick={() => setFilterCat('all')} className={`px-4 py-2 text-xs font-bold rounded-full shadow-sm whitespace-nowrap transition-colors ${filterCat === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>ทั้งหมด ({meals.length})</button>
            {categories.map(c => {
              const count = meals.filter(m => m.categoryId === c.id).length;
              if(count === 0) return null;
              return (

                      <button onClick={() => onDeleteMeal(m.id)} className="w-8 h-8 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-rose-400 hover:text-rose-600 hover:bg-rose-50 shadow-sm transition"><Icon name="delete" className="text-[16px]"/></button>

          {filteredMeals.length === 0 && <div className="text-center bg-white border-2 border-dashed border-slate-200 rounded-2xl py-16 text-slate-400">ไม่พบข้อมูลที่ค้นหา</div>}

    // ==========================================
    // 5. APP CONTAINER
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('settle');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      
      const [friends, setFriends] = useState([]);
      const [meals, setMeals] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [settledDebts, setSettledDebts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const summaryRef = useRef(null);

      // Modals State
      const [modals, setModals] = useState({ 
        addMeal: false, addFriend: false, qr: false, category: false, export: false, viewMeal: false
      });
      const [selectedTransfer, setSelectedTransfer] = useState(null);
      const [editingMeal, setEditingMeal] = useState(null);
      const [editingFriend, setEditingFriend] = useState(null);
      const [viewingMeal, setViewingMeal] = useState(null);

      useEffect(() => {
        const unsubFriends = db.collection('friends').orderBy('createdAt', 'asc').onSnapshot(snap => {
          setFriends(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubMeals = db.collection('meals').orderBy('date', 'desc').onSnapshot(snap => {
          setMeals(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setIsLoading(false);
        });
        const unsubCategories = db.collection('categories').onSnapshot(snap => {
          if (snap.docs.length > 0) setCategories(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubSettled = db.collection('settled_debts').onSnapshot(snap => {
          setSettledDebts(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        return () => { unsubFriends(); unsubMeals(); unsubCategories(); unsubSettled(); };
      }, []);

      const openModal = (name, data = null) => {
        if (name === 'qr') setSelectedTransfer(data);
        if (name === 'addMeal') setEditingMeal(data);
        if (name === 'addFriend') setEditingFriend(data);
        if (name === 'viewMeal') setViewingMeal(data);
        setModals(prev => ({ ...prev, [name]: true }));
      };
      const closeModal = (name) => {
        if (name === 'addMeal') setEditingMeal(null);
        if (name === 'addFriend') setEditingFriend(null);
        if (name === 'viewMeal') setViewingMeal(null);
        setModals(prev => ({ ...prev, [name]: false }));
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('name').trim();
        if (name) {
          const data = {
            name, 
            promptPay: formData.get('promptPay').trim(), 
            bankName: formData.get('bankName').trim(), 
            bankAccount: formData.get('bankAccount').trim(), 
          };
          if (editingFriend && editingFriend.id) {
            await db.collection('friends').doc(editingFriend.id).update(data);
          } else {
            const colors = ['bg-indigo-500','bg-emerald-500','bg-rose-500','bg-amber-500','bg-purple-500', 'bg-cyan-500'];
            data.color = colors[friends.length % colors.length];
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('friends').add(data);
          }
          closeModal('addFriend');
        }
      };

      const handleAddMeal = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const title = formData.get('title').trim();
        const baseAmount = parseFloat(formData.get('amount'));
        const payerId = formData.get('payerId');
        const participantIds = formData.getAll('participants');
        
        if (title && baseAmount && payerId && participantIds.length > 0) {
          const hasVat = formData.get('hasVat') !== null;
          const hasSc = formData.get('hasServiceCharge') !== null;
          const discountAmt = parseFloat(formData.get('discount')) || 0;
          const rounding = formData.get('rounding') || 'actual';

          let calcFinal = baseAmount - discountAmt;
          if (hasSc) calcFinal += (calcFinal * 0.10);
          if (hasVat) calcFinal += (calcFinal * 0.07);

          let splitAmountRaw = calcFinal / participantIds.length;
          let splitAmount = splitAmountRaw;
          if (rounding === 'ceil') splitAmount = Math.ceil(splitAmountRaw);
          else if (rounding === 'round') splitAmount = Math.round(splitAmountRaw);
          else if (rounding === 'floor') splitAmount = Math.floor(splitAmountRaw);

          const adjustedFinal = splitAmount * participantIds.length;
          const participants = participantIds.map(id => ({ friendId: id, amount: splitAmount }));

          const data = {
            title, date: formData.get('date'), categoryId: formData.get('category'), 
            baseAmount, finalAmount: adjustedFinal, discount: discountAmt, hasVat, hasServiceCharge: hasSc, 
            payerId, participants, splitMode: 'equal', roundingMode: rounding
          };

          if (editingMeal && editingMeal.id) {
            await db.collection('meals').doc(editingMeal.id).update(data);
          } else {
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('meals').add(data);
          }
          closeModal('addMeal');
        } else alert('กรุณากรอกข้อมูลให้ครบถ้วน');
      };

      const deleteMeal = async (id) => {
        if(confirm('ยืนยันการลบบิลมื้อนี้? การคำนวณหักลบหนี้จะเปลี่ยนไปทันที')) {
          await db.collection('meals').doc(id).delete();
          closeModal('viewMeal');
        }
      };

      const handleSettleDebt = async (transfer) => {
        if(confirm(`ยืนยันการเคลียร์ยอด ${transfer.amount} บาท ให้ ${transfer.toName}?`)) {
          await db.collection('settled_debts').add({
            fromId: transfer.fromId, toId: transfer.toId, amount: transfer.amount,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      };

      const shareToLine = () => {
        if (settleData.transfers.length === 0) return alert('เคลียร์ยอดครบแล้ว ไม่มีใครค้างเงิน');
        let text = `💸 สรุปยอดหารค่าอาหาร (${meals.length} มื้อ)\nรวมทั้งหมด: ${settleData.totalExpense.toLocaleString()} บาท\n\n📌 ยอดที่ต้องโอนสุทธิ:\n`;
        settleData.transfers.forEach(t => {
          text += `👉 ${t.fromName} โอนให้ ${t.toName}: ${t.amount.toLocaleString()} ฿\n`;
          if (t.promptPay) text += `   พร้อมเพย์: ${t.promptPay}\n`;
          else if (t.bankAccount) text += `   บัญชี: ${t.bankName} ${t.bankAccount}\n`;
        });
        text += `\n✨ คำนวณโดย MealSplit TH`;
        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
      };

      const settleData = useMemo(() => calculateSettlement(meals, friends, settledDebts), [meals, friends, settledDebts]);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold flex-col gap-4"><Icon name="sync" className="animate-spin text-4xl"/> กำลังโหลดข้อมูล...</div>;

      return (
        <>
          <div className="max-w-6xl mx-auto min-h-screen flex flex-col bg-slate-50 border-x border-slate-200">
            
            {/* ================= HEADER ================= */}
            <div className="bg-white border-b border-slate-200 p-4 sticky top-0 z-30 flex items-center justify-between shadow-sm">
              <div className="flex items-center gap-3">
                <button onClick={() => setIsDrawerOpen(true)} className="p-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 sm:hidden"><Icon name="menu"/></button>
                <div className="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-md"><Icon name="receipt_long"/></div>
                <div>
                  <h1 className="font-bold text-slate-800 text-lg flex items-center gap-2">MealSplit <span className="text-[10px] bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded-full">ระบบหักลบหนี้</span></h1>
                  <p className="text-[11px] text-slate-500 hidden sm:block">หักลบหนี้ & สรุปยอด • ยอดรวม {settleData.totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</p>
                </div>
              </div>
              <div className="flex gap-2">
                <button className="hidden sm:flex items-center gap-1 px-3 py-2 border border-emerald-200 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-100 transition"><Icon name="table_view" className="text-sm"/> Google Sheets</button>
                <button onClick={shareToLine} className="hidden sm:flex items-center gap-1 px-3 py-2 border border-slate-200 bg-white text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-50 transition"><Icon name="share" className="text-sm text-[#06C755]"/> แชร์เข้า LINE</button>
                <button onClick={() => openModal('addMeal')} className="flex items-center gap-1 px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-md hover:bg-indigo-700 transition"><Icon name="add" className="text-sm"/> ลงบันทึกมื้อใหม่</button>
              </div>
            </div>

            {/* ================= TABS ================= */}
            <div className="flex bg-white shadow-sm border-b border-slate-200 text-sm font-bold text-slate-500">
              <button onClick={() => setActiveTab('settle')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition ${activeTab === 'settle' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/50' : 'hover:bg-slate-50'}`}>
                <Icon name="balance" className="text-lg"/> เคลียร์ยอด
              </button>
              <button onClick={() => setActiveTab('calendar')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition ${activeTab === 'calendar' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/50' : 'hover:bg-slate-50'}`}>
                <Icon name="calendar_month" className="text-lg"/> ปฏิทิน <span className="hidden sm:inline bg-indigo-100 text-indigo-700 px-1.5 rounded text-[10px]">{meals.length} มื้อ</span>
              </button>
              <button onClick={() => setActiveTab('meals')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition ${activeTab === 'meals' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/50' : 'hover:bg-slate-50'}`}>
                <Icon name="receipt" className="text-lg"/> บิลอาหาร
              </button>
              <button onClick={() => setActiveTab('friends')} className={`flex-1 py-4 flex items-center justify-center gap-2 transition ${activeTab === 'friends' ? 'text-indigo-700 border-b-2 border-indigo-600 bg-indigo-50/50' : 'hover:bg-slate-50'}`}>
                <Icon name="group" className="text-lg"/> เพื่อน

            {/* Sidebar Drawer (Mobile) */}

              <div className="fixed inset-0 z-50 flex sm:hidden">
                <div className="fixed inset-0 modal-overlay transition-opacity" onClick={() => setIsDrawerOpen(false)}></div>
                <div className="relative w-full max-w-sm bg-white shadow-2xl flex flex-col animate-slide-in">
                  <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><Icon name="receipt_long" className="text-[18px]"/></div>
                      <div><h2 className="font-bold text-slate-800">MealSplit TH</h2><p className="text-xs text-slate-500">เมนูหลัก & การจัดการ</p></div>
                    </div>
                    <button onClick={() => setIsDrawerOpen(false)} className="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-700"><Icon name="close" className="text-[18px]"/></button>
                  </div>
                  <div className="p-4 space-y-1 overflow-y-auto flex-1">
                    <div className="text-[11px] font-bold text-slate-400 mb-2 px-3">เลือกมุมมอง</div>
                    
                    <button onClick={() => { setActiveTab('settle'); setIsDrawerOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left ${activeTab === 'settle' ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center shadow-sm ${activeTab === 'settle' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}><Icon name="balance" /></div>
                      <div><div className={`text-sm font-bold ${activeTab==='settle'?'text-indigo-700':'text-slate-700'}`}>หักลบหนี้ & สรุปยอด</div><div className="text-[11px] text-slate-400">ระบบคำนวณหักกลบลบหนี้อัตโนมัติ</div></div>
                    </button>

                    <button onClick={() => { setActiveTab('calendar'); setIsDrawerOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left ${activeTab === 'calendar' ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center shadow-sm ${activeTab === 'calendar' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}><Icon name="calendar_month" /></div>
                      <div>
                        <div className={`text-sm font-bold flex items-center gap-2 ${activeTab==='calendar'?'text-indigo-700':'text-slate-700'}`}>ปฏิทินรายวัน <span className="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded-md">{meals.length} มื้อ</span></div>
                        <div className="text-[11px] text-slate-400">ดูประวัติค่าอาหารตามวันที่ในปฏิทิน</div>

                    <div className="mt-6 pt-6 border-t border-slate-100 flex gap-2">
                      <button onClick={shareToLine} className="flex-1 py-2 bg-[#06C755] text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1"><Icon name="share" className="text-sm"/> แชร์ LINE</button>
                      <button onClick={() => { setIsDrawerOpen(false); openModal('export'); }} className="flex-1 py-2 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg text-xs font-bold flex items-center justify-center gap-1"><Icon name="image" className="text-sm"/> เซฟรูป</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ================= CONTENT AREA ================= */}
            <div className="flex-1 p-4 sm:p-6 lg:p-8 bg-slate-50 pb-24">
              
              {/* === TAB 1: SETTLEMENT === */}
              {activeTab === 'settle' && (
                <SettlementView 
                  settlementData={settleData} 
                  meals={meals} 
                  friends={friends} 
                  onSettleDebt={handleSettleDebt} 
                  onOpenQR={(data) => openModal('qr', data)} 
                  exportToImage={() => openModal('export')} 
                  shareToLine={shareToLine} 
                />
              )}

              {/* === TAB 2: CALENDAR === */}
              {activeTab === 'calendar' && (
                <CalendarView 
                  meals={meals} 
                  friends={friends} 
                  onOpenAddMeal={(date) => openModal('addMeal', { date })}
                  onViewMeal={(m) => openModal('viewMeal', m)}
                  onEditMeal={(m) => openModal('addMeal', m)}
                  onCopyMeal={(m) => openModal('addMeal', {...m, id: null, title: m.title + ' (คัดลอก)'})}
                  onDeleteMeal={deleteMeal}
                />
              )}

              {/* === TAB 3: MEALS === */}
              {activeTab === 'meals' && (
                <MealsView 
                  meals={meals} 
                  friends={friends} 
                  categories={categories}
                  onViewMeal={(m) => openModal('viewMeal', m)}
                  onEditMeal={(m) => openModal('addMeal', m)}
                  onCopyMeal={(m) => openModal('addMeal', {...m, id: null, title: m.title + ' (คัดลอก)'})}
                  onDeleteMeal={deleteMeal} 
                />
              )}

              {/* === TAB 4: FRIENDS === */}
              {activeTab === 'friends' && (
                <FriendsView 
                  friends={friends} 
                  onOpenEditFriend={(f) => openModal('addFriend', f)} 
                  onDeleteFriend={(id) => {
                    if(confirm('ลบเพื่อนคนนี้? บิลที่มีเพื่อนคนนี้อยู่จะคำนวณยอดเปลี่ยนไป')) {
                      db.collection('friends').doc(id).delete();
                    }
                  }} 
                />
              )}

            </div>
          </div>

          {/* ================= MODALS ================= */}

          {/* 1. Add/Edit Meal Modal (จัดเต็ม) */}
          {modals.addMeal && (
            <AddMealModal 
              isOpen={modals.addMeal} 
              onClose={() => closeModal('addMeal')} 
              initialData={editingMeal}
              friends={friends} 
              categories={categories}
              openCategoryManager={() => openModal('category')}
              onSubmit={handleAddMeal}
            />
          )}

          {/* 2. Add/Edit Friend Modal */}
          <Modal isOpen={modals.addFriend} onClose={() => closeModal('addFriend')} title={editingFriend ? "แก้ไขข้อมูลเพื่อน" : "เพิ่มรายชื่อเพื่อน & บัญชีรับเงิน"}>
            <form onSubmit={handleAddFriend} className="space-y-4 p-5">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อเพื่อน / ชื่อเล่น *</label>
                <input name="name" defaultValue={editingFriend?.name || ''} placeholder="ระบุชื่อเรียกในกลุ่ม" className="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 focus:ring-1" required />
              </div>
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">เบอร์พร้อมเพย์</label>
                <input name="promptPay" defaultValue={editingFriend?.promptPay || ''} placeholder="08X-XXX-XXXX" className="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 font-mono" />
              </div>
              <div className="flex gap-3">
                <div className="w-1/2">
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อธนาคาร</label>
                  <input name="bankName" defaultValue={editingFriend?.bankName || ''} placeholder="เช่น กสิกรไทย" className="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500" />
                </div>
                <div className="w-1/2">
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">เลขบัญชี</label>
                  <input name="bankAccount" defaultValue={editingFriend?.bankAccount || ''} placeholder="เลข 10 หลัก" className="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 font-mono" />
                </div>
              </div>
              <div className="pt-2">
                <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-md hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                  <Icon name={editingFriend ? "save" : "check_circle"} className="text-[18px]"/> {editingFriend ? "บันทึกการแก้ไข" : "บันทึกเพื่อนใหม่"}
                </button>
              </div>
            </form>
          </Modal>

          {/* 3. Category Manager Modal */}
          <CategoryManagerModal 
            isOpen={modals.category} 
            onClose={() => closeModal('category')} 
            categories={categories} 
          />

          {/* 4. QR Code Modal */}
          <QRCodeModal 
            isOpen={modals.qr} 
            onClose={() => closeModal('qr')} 
            transfer={selectedTransfer}
            onSettle={handleSettleDebt} 
          />

          {/* 5. Image Export Modal */}
          <ImageExportModal 
            isOpen={modals.export} 
            onClose={() => closeModal('export')} 
            settlementData={settleData}
            meals={meals}
            friends={friends}
          />

          {/* 6. View Meal Detail Modal */}
          <ViewMealModal
            isOpen={modals.viewMeal}
            onClose={() => closeModal('viewMeal')}
            meal={viewingMeal}
            friends={friends}
            categories={categories}
            onEdit={() => { closeModal('viewMeal'); openModal('addMeal', viewingMeal); }}
            onDelete={() => deleteMeal(viewingMeal.id)}
          />

        </>
      );
    }

    // ==========================================
    // 6. EXTRA COMPONENTS (Implementation of Modals/Views)
    // ==========================================

    function AddMealModal({ isOpen, onClose, initialData, friends, categories, openCategoryManager, onSubmit }) {
      const [amount, setAmount] = useState(initialData?.baseAmount || '');
      const [discount, setDiscount] = useState(initialData?.discount || '');
      const [hasVat, setHasVat] = useState(initialData?.hasVat || false);
      const [hasSc, setHasSc] = useState(initialData?.hasServiceCharge || false);
      const [rounding, setRounding] = useState(initialData?.roundingMode || 'actual');
      const [payerId, setPayerId] = useState(initialData?.payerId || '');
      const [participants, setParticipants] = useState({});

      useEffect(() => {
        if (isOpen) {
          const initialParts = {};
          if (initialData && initialData.participants) {
            friends.forEach(f => initialParts[f.id] = false);
            initialData.participants.forEach(p => initialParts[p.friendId] = true);
          } else {
            friends.forEach(f => initialParts[f.id] = true);
          }
          setParticipants(initialParts);
          
          if (!initialData) {
            setAmount(''); setDiscount(''); setHasVat(false); setHasSc(false); 
            setRounding('actual'); setPayerId('');
          }
        }
      }, [isOpen, friends, initialData]);

      if (!isOpen) return null;

      const baseAmount = parseFloat(amount) || 0;
      const discountAmt = parseFloat(discount) || 0;
      let calcFinal = baseAmount - discountAmt;
      if (hasSc) calcFinal += (calcFinal * 0.10);
      if (hasVat) calcFinal += (calcFinal * 0.07);

      const activeCount = Object.values(participants).filter(Boolean).length;
      let splitAmountRaw = activeCount > 0 ? (calcFinal / activeCount) : 0;
      
      let splitAmount = splitAmountRaw;
      if (rounding === 'ceil') splitAmount = Math.ceil(splitAmountRaw);
      else if (rounding === 'round') splitAmount = Math.round(splitAmountRaw);
      else if (rounding === 'floor') splitAmount = Math.floor(splitAmountRaw);

      const adjustedFinal = splitAmount * activeCount;

      const toggleParticipant = (id) => setParticipants(prev => ({ ...prev, [id]: !prev[id] }));
      const selectAll = () => { const next = {}; friends.forEach(f => next[f.id] = true); setParticipants(next); };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={initialData?.id ? "แก้ไขมื้ออาหาร" : "บันทึกมื้ออาหารใหม่"} fullWidth>
          <form onSubmit={onSubmit} className="bg-slate-50 p-4 sm:p-5 rounded-b-2xl space-y-5">
            <input type="hidden" name="rounding" value={rounding} />
            <div className="space-y-4 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อร้าน / มื้ออาหาร <span className="text-slate-400 font-normal">(ไม่ระบุก็ได้)</span></label>
                <input name="title" defaultValue={initialData?.title || ''} placeholder="เช่น ข้าวมันไก่, ชาบู หรือระบุยอดอย่างเดียวได้เลย" className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 text-sm bg-slate-50" required />
              </div>
              <div className="flex gap-3">
                <div className="w-1/2">
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">วันที่</label>
                  <input type="date" name="date" defaultValue={initialData?.date || new Date().toISOString().split('T')[0]} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm text-slate-600 bg-slate-50" required />
                </div>
                <div className="w-1/2">
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="text-xs font-bold text-slate-700">หมวดหมู่</label>
                    <button type="button" onClick={openCategoryManager} className="text-[10px] text-indigo-600 font-bold flex items-center gap-0.5 hover:underline"><Icon name="sell" className="text-[12px]"/> จัดการหมวดหมู่</button>
                  </div>
                  <select name="category" defaultValue={initialData?.categoryId || categories[0]?.id} className="w-full p-3 rounded-xl border border-slate-200 outline-none bg-slate-50 focus:border-indigo-500 text-sm">
                    {categories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </div>
              </div>
              <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-4">
                <div className="flex justify-between items-end gap-3">
                  <div className="w-1/2">
                    <label className="text-xs font-bold text-rose-600 mb-1.5 block">ยอดเงินรวม (บาท) *</label>
                    <input name="amount" type="number" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-indigo-500 font-mono font-bold text-lg text-slate-800" required />
                  </div>
                  <div className="w-1/2 flex flex-col justify-end">
                    <div className="flex items-center gap-3 mb-2 text-[11px] sm:text-xs font-semibold text-slate-600">
                      <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="hasServiceCharge" checked={hasSc} onChange={e=>setHasSc(e.target.checked)} className="w-3.5 h-3.5 text-indigo-600 rounded" /> + Service 10%</label>
                      <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="hasVat" checked={hasVat} onChange={e=>setHasVat(e.target.checked)} className="w-3.5 h-3.5 text-indigo-600 rounded" /> + VAT 7%</label>
                    </div>
                    <input name="discount" type="number" step="0.01" value={discount} onChange={e=>setDiscount(e.target.value)} placeholder="ส่วนลด (ถ้ามี)" className="w-full p-2.5 rounded-lg border border-slate-300 outline-none focus:border-indigo-500 text-sm font-mono" />
                  </div>
                </div>
                <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-100 gap-2">
                  <div className="flex items-center gap-1.5 text-indigo-700 text-xs font-bold"><Icon name="balance" className="text-[16px]"/> ระบบปัดเศษเงินที่หาร:</div>
                  <div className="flex gap-1 text-[11px] font-semibold">
                    <button type="button" onClick={()=>setRounding('actual')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'actual' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ตามจริง</button>
                    <button type="button" onClick={()=>setRounding('ceil')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'ceil' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ปัดขึ้น</button>
                    <button type="button" onClick={()=>setRounding('round')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'round' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ปัดปกติ</button>
                    <button type="button" onClick={()=>setRounding('floor')} className={`px-3 py-1.5 rounded-md transition ${rounding === 'floor' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}>ปัดลง</button>
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-bold text-slate-800 flex items-center gap-1.5"><Icon name="account_balance_wallet" className="text-amber-600 text-[18px]"/> ใครเป็นคนสำรองจ่ายเงิน?</label>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {friends.map(f => (
                  <label key={f.id} className="cursor-pointer">
                    <input type="radio" name="payerId" value={f.id} checked={payerId === f.id} onChange={(e) => setPayerId(e.target.value)} className="peer sr-only" required />
                    <div className="p-2.5 rounded-xl border border-slate-200 bg-white flex items-center gap-2 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:ring-1 peer-checked:ring-indigo-600 transition">
                      <div className={`w-6 h-6 rounded-md text-white font-bold flex items-center justify-center text-xs ${f.color || 'bg-slate-500'}`}>{f.name.charAt(0)}</div>
                      <span className="text-xs font-bold text-slate-700 truncate">{f.name}</span>
                    </div>
                  </label>
                ))}
                {friends.length === 0 && <p className="text-xs text-rose-500 col-span-full">กรุณาเพิ่มเพื่อนในแท็บ 'เพื่อน' ก่อน</p>}
              </div>
            </div>

            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-bold text-slate-800 flex items-center gap-1.5"><Icon name="restaurant" className="text-rose-500 text-[18px]"/> เลือกคนกินที่ต้องหารมื้อนี้:</label>
                <button type="button" onClick={selectAll} className="text-[11px] text-indigo-600 font-bold hover:underline">เลือกทุกคน</button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                {friends.map(f => {
                  const isChecked = participants[f.id];
                  const isPayer = payerId === f.id;
                  const paidAmount = isPayer ? adjustedFinal : 0;
                  const owedAmount = isChecked ? splitAmount : 0;
                  const net = paidAmount - owedAmount;
                  
                  return (
                    <div key={f.id} onClick={() => toggleParticipant(f.id)} className={`p-3 rounded-xl border cursor-pointer flex flex-col justify-between transition ${isChecked ? 'bg-indigo-50/40 border-indigo-300' : 'bg-white border-slate-200 opacity-60 hover:opacity-100'}`}>
                      <input type="checkbox" name="participants" value={f.id} checked={isChecked} onChange={() => {}} className="hidden" />
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <div className={`w-4 h-4 rounded border flex items-center justify-center ${isChecked ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300 bg-white'}`}>
                            {isChecked && <Icon name="check" className="text-white text-[12px]"/>}
                          </div>
                          <span className="text-sm font-bold text-slate-800 truncate max-w-[80px]">{f.name}</span>
                        </div>
                        <span className={`text-[11px] font-mono font-bold ${isChecked ? 'text-indigo-700' : 'text-slate-400'}`}>ค่ากิน {owedAmount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                      </div>
                      <div className="flex justify-between items-center pt-2 border-t border-slate-200/60 text-[10px] text-slate-500">
                        <span>{isPayer ? <span className="text-rose-600 font-semibold">จ่ายออก {adjustedFinal.toLocaleString()} ฿</span> : 'ไม่ได้จ่ายออก'}</span>
                        <span className={`font-bold px-2 py-0.5 rounded ${net > 0 ? 'bg-emerald-100 text-emerald-700' : net < 0 ? 'bg-rose-100 text-rose-700' : 'bg-slate-200 text-slate-600'}`}>
                          {net > 0 ? `ได้คืน +${net.toLocaleString()}` : net < 0 ? `จ่ายเพิ่ม ${Math.abs(net).toLocaleString()}` : 'พอดี 0 ฿'}
                        </span>
                      </div>
                    </div>
                  )
                })}
              </div>
            </div>
            
            <div className="flex gap-3 pt-2">
              <button type="button" onClick={onClose} className="w-1/3 bg-white border border-slate-300 text-slate-700 font-bold py-3.5 rounded-xl text-sm hover:bg-slate-50 transition">ยกเลิก</button>
              <button disabled={friends.length === 0 || !amount || !payerId || activeCount === 0} type="submit" className="w-2/3 bg-indigo-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-md hover:bg-indigo-700 transition disabled:opacity-50 flex items-center justify-center gap-2">
                <Icon name="check_circle" className="text-[18px]"/> {initialData?.id ? 'บันทึกการแก้ไข' : 'บันทึกบิลอาหาร'}
              </button>
            </div>
          </form>
        </Modal>
      );
    }

    function ViewMealModal({ isOpen, onClose, meal, friends, categories, onEdit, onDelete }) {
      if (!isOpen || !meal) return null;
      const payer = friends.find(f => f.id === meal.payerId);
      const cat = categories.find(c => c.id === meal.categoryId) || DEFAULT_CATEGORIES[0];
      return (
        <Modal isOpen={isOpen} onClose={onClose} noPadding>
          <div className="bg-gradient-to-br from-indigo-700 to-indigo-900 p-6 text-white rounded-t-2xl relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-indigo-200 hover:text-white"><Icon name="close"/></button>
            <div className="flex items-center gap-2 mb-2">
              <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full bg-white/20 backdrop-blur-sm`}>{cat.label}</span>
              <span className="text-[10px] text-indigo-200 font-mono"><Icon name="calendar_today" className="text-[12px]"/> {meal.date}</span>
            </div>
            <h2 className="text-2xl font-bold mb-4">{meal.title}</h2>
            <div className="flex justify-between items-end">
              <div>
                <p className="text-[10px] text-indigo-300 uppercase tracking-wider mb-1">ยอดรวมทั้งบิล</p>
                <div className="text-4xl font-mono font-extrabold">{meal.finalAmount.toLocaleString('th-TH', {minimumFractionDigits:2})} <span className="text-xl">฿</span></div>
              </div>
            </div>
          </div>
          <div className="p-6 bg-slate-50 rounded-b-2xl space-y-4">
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-sm space-y-3">
              <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                <span className="text-slate-500 font-bold flex items-center gap-1.5"><Icon name="account_balance_wallet" className="text-amber-500"/> คนสำรองจ่าย:</span>
                <span className="font-bold text-slate-800">{payer?.name || '?'}</span>
              </div>
              <div>
                <span className="text-slate-500 font-bold flex items-center gap-1.5 mb-2"><Icon name="restaurant" className="text-rose-500"/> คนร่วมทาน ({meal.participants.length} คน):</span>
                <div className="space-y-2">
                  {meal.participants.map(p => {
                    const f = friends.find(x => x.id === p.friendId);
                    return (
                      <div key={p.friendId} className="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg">
                        <div className="flex items-center gap-2">
                          <div className={`w-5 h-5 rounded-full text-white flex items-center justify-center text-[9px] font-bold ${f?.color || 'bg-slate-500'}`}>{f?.name?.charAt(0) || '?'}</div>
                          <span className="font-medium text-slate-700">{f?.name || '?'}</span>
                        </div>
                        <span className="font-mono font-bold text-indigo-600">{p.amount.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
                      </div>
                    )
                  })}
                </div>
              </div>
            </div>
            
            <div className="flex gap-2">
              <button onClick={onEdit} className="flex-1 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-100 shadow-sm flex items-center justify-center gap-1.5"><Icon name="edit" className="text-[18px]"/> แก้ไขมื้อนี้</button>
              <button onClick={onDelete} className="flex-1 py-3 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl font-bold text-sm hover:bg-rose-100 shadow-sm flex items-center justify-center gap-1.5"><Icon name="delete" className="text-[18px]"/> ลบมื้อนี้</button>
            </div>
          </div>
        </Modal>
      );
    }

    function CategoryManagerModal({ isOpen, onClose, categories }) {
      const [newCat, setNewCat] = useState('');

      const handleAdd = async (e) => {
        e.preventDefault();
        if (newCat.trim()) {
          await db.collection('categories').add({ label: newCat.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          setNewCat('');
        }
      };

      if (!isOpen) return null;

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="จัดการหมวดหมู่อาหาร">
          <div className="p-5 space-y-4">
            <form onSubmit={handleAdd} className="flex gap-2">
              <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="ชื่อหมวดหมู่ใหม่ เช่น ซูชิ" className="flex-1 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-indigo-500 bg-slate-50"/>

    function ImageExportModal({ isOpen, onClose, settlementData, meals }) {
      const summaryRef = useRef(null);

        if (summaryRef.current) {
          const canvas = await html2canvas(summaryRef.current, { scale: 2, backgroundColor: style === 'notebook' ? '#f8fafc' : '#ffffff' });
          const link = document.createElement('a');
          link.download = `สรุปยอดหารค่าข้าว_${new Date().toISOString().split('T')[0]}.png`;
          link.href = canvas.toDataURL();
          link.click();
        }
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="บันทึกสรุปยอดเป็นรูปภาพ" fullWidth>

              </div>
            </div>

            <div className="max-h-[55vh] overflow-y-auto w-full flex justify-center pb-4 hide-scrollbar">
              <div ref={summaryRef} className={`w-full max-w-sm p-6 sm:p-8 shadow-lg rounded-3xl ${style === 'notebook' ? 'bg-notebook border-2 border-amber-200 font-sans' : 'bg-white border border-slate-200 font-sans'}`}>
                <div className="text-center border-b border-dashed border-slate-300 pb-5 mb-5">
                  <div className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold mb-3 ${style === 'notebook' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'}`}>

                <div className="space-y-2 mb-6">
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="text-xs font-bold text-slate-800">📌 ยอดที่ต้องโอนจริง <span className="text-slate-500 font-normal">(หักลบแล้ว)</span>:</h3>
                    <span className="text-[9px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">โอนสุทธิ</span>
                  </div>
                  {settlementData.transfers.map((t, i) => (

                <div className="space-y-3 mb-6 border-t border-dashed border-slate-300 pt-5">

                  {meals.map((m, i) => {
                    const payerName = settlementData.balances[m.payerId]?.name || 'Unknown';
                    const perPerson = m.finalAmount / m.participants.length;
                    return (

                          <span>จ่ายโดย: <strong className="text-slate-700">{payerName}</strong></span>
                          <span>(คนละ {perPerson.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿)</span>

                    ) : null;
                  })}
                </div>

                <div className="mt-8 text-center text-[9px] text-slate-400 font-mono">สร้างด้วยระบบหารค่าข้าว MealSplit TH</div>
              </div>
            </div>

            <div className="w-full flex gap-3 mt-4">
              <button onClick={onClose} className="px-6 py-3.5 rounded-xl border border-slate-300 font-bold text-sm text-slate-700 bg-white hover:bg-slate-50 transition shadow-sm">ปิด</button>

                <Icon name="file_download"/> ดาวน์โหลดรูปภาพ
              </button>
            </div>
          </div>
        </Modal>
      )
    }

                        <div className="flex flex-col items-start md:items-end border-t md:border-t-0 border-slate-100 pt-4 md:pt-0">
                          <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">ยอดโอนสุทธิ</span>
                          <span className="text-4xl font-mono font-extrabold text-rose-600 tracking-tighter">{t.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})} <span className="text-xl">฿</span></span>
                        </div>
                      </div>

                      <div className="mt-6 flex flex-wrap gap-3 md:justify-end">
                        <button onClick={() => onOpenQR(t)} className="flex-1 md:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-xl text-xs font-bold transition">
                          <Icon name="qr_code_2" className="text-[18px]"/> QR พร้อมเพย์
                        </button>
                        <button onClick={() => { navigator.clipboard.writeText(t.promptPay || t.bankAccount || ''); alert('คัดลอกเลขบัญชีแล้ว'); }} className="flex-1 md:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-xl text-xs font-bold transition">
                          <Icon name="content_copy" className="text-[18px]"/> พร้อมเพย์
                        </button>
                        <button onClick={() => onSettleDebt(t)} className="w-full md:w-auto flex items-center justify-center gap-1.5 px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold shadow-md shadow-emerald-100 transition">
                          <Icon name="check_circle" className="text-[18px]"/> เคลียร์แล้ว
                        </button>
                      </div>
                      
                      <div className="mt-4 bg-slate-50 rounded-xl border border-slate-200 p-3 flex flex-wrap items-center gap-3 text-xs">
                        <div className="flex items-center gap-1.5 text-slate-500 font-medium">
                          <Icon name="account_balance_wallet" className="text-[16px]"/> ช่องทางรับเงินของ {t.toName}:
                        </div>
                        {t.promptPay && <div className="bg-white border border-slate-200 px-3 py-1.5 rounded-lg font-mono font-bold text-slate-700 shadow-sm">พร้อมเพย์: {t.promptPay}</div>}
                        {t.bankAccount && <div className="bg-white border border-slate-200 px-3 py-1.5 rounded-lg font-mono font-bold text-slate-700 shadow-sm">{t.bankName} {t.bankAccount}</div>}
                        {!t.promptPay && !t.bankAccount && <div className="text-rose-500 bg-rose-50 px-2 py-1 rounded">ยังไม่ระบุบัญชีรับเงิน</div>}
                        <button onClick={() => onOpenQR(t)} className="ml-auto text-indigo-600 font-bold flex items-center gap-1 hover:underline"><Icon name="qr_code_2" className="text-[16px]"/> เปิด QR สแกนจ่าย</button>
                      </div>
                    </div>
                    
                    <div className="bg-slate-50 border-t border-slate-100 px-5 py-3 text-xs cursor-pointer hover:bg-slate-100 transition" onClick={() => setExpandedId(expandedId === idx ? null : idx)}>
                      <div className="flex justify-between items-center">
                        <span className="text-slate-500 font-medium">คำนวณจากประวัติบิล {t.history?.length || 0} รายการ</span>
                        <span className="text-indigo-600 font-semibold flex items-center gap-1">ดูวิธีคิดหักลบหนี้ <Icon name={expandedId === idx ? "expand_less" : "expand_more"} className="text-[16px]"/></span>
                      </div>
                      {expandedId === idx && (
                        <div className="mt-3 pt-3 border-t border-slate-200 space-y-2 cursor-default" onClick={e=>e.stopPropagation()}>
                          {t.history?.map(hm => {
                            const isDebtorPayer = hm.payerId === t.fromId;
                            const amountOwed = hm.finalAmount / hm.participants.length;
                            return (
                              <div key={hm.id} className="flex justify-between items-center p-2 bg-white rounded border border-slate-200">
                                <div>
                                  <div className="font-bold text-slate-700">• {hm.title}</div>
                                  <div className="text-[10px] text-slate-400">ยอดบิล {hm.finalAmount}฿ (หาร {hm.participants.length} คน)</div>
                                </div>
                                <div className="text-right">
                                  <div className={`font-mono font-bold ${isDebtorPayer ? 'text-emerald-600' : 'text-rose-600'}`}>{isDebtorPayer ? '+' : '-'}{amountOwed.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</div>
                                  <div className="text-[9px] text-slate-400">{isDebtorPayer ? `${t.fromName} สำรองจ่าย` : `${t.toName} สำรองจ่าย`}</div>
                                </div>
                              </div>
                            )
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm mt-6">
            <div className="flex justify-between items-center mb-5 border-b border-slate-100 pb-3">
              <h3 className="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-2"><Icon name="group" className="text-indigo-600"/> สรุปยอดสถานะของสมาชิกแต่ละคน</h3>
              <span className="text-xs text-slate-500 font-mono bg-slate-50 px-3 py-1 rounded-lg border border-slate-200">ยอดเงินรวม: {settlementData.totalExpense.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {friends.map(f => {
                const b = settlementData.balances[f.id];
                const isPositive = b.net > 0.01;
                const isNegative = b.net < -0.01;
                return (
                  <div key={f.id} className="border border-slate-200 rounded-xl p-4 bg-slate-50/50 hover:bg-white hover:shadow-md transition">
                    <div className="flex justify-between items-start mb-3">
                      <div className="flex items-center gap-2.5">
                        <div className={`w-8 h-8 rounded-full text-white font-bold flex items-center justify-center text-xs shadow-inner ${f.color || 'bg-slate-500'}`}>{f.name.charAt(0)}</div>
                        <span className="font-bold text-slate-800 text-sm">{f.name}</span>
                      </div>
                      <span className={`text-[9px] font-bold px-2 py-1 rounded border ${isPositive ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : isNegative ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
                        {isPositive ? 'ได้รับคืน' : isNegative ? 'ต้องจ่ายออก' : 'ลงตัว'}
                      </span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-500 mb-3 border-y border-slate-100 py-2">
                      <div><span className="block mb-0.5">ออกเงินไป</span><strong className="font-mono text-slate-700 text-xs">{b.totalPaid.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</strong></div>
                      <div><span className="block mb-0.5">กิน/ใช้ไป</span><strong className="font-mono text-slate-700 text-xs">{b.totalOwed.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</strong></div>
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-500 font-medium">ยอดสุทธิ:</span>
                      <span className={`font-mono font-extrabold text-sm ${isPositive ? 'text-emerald-600' : isNegative ? 'text-rose-600' : 'text-slate-700'}`}>
                        {isPositive ? '+' : ''}{b.net.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿
                      </span>
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
