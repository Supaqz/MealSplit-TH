  <script type="text/babel">

    const firebaseConfig = {

    // ==========================================
    // 2. HELPER LOGIC
    // ==========================================
    function generatePromptPayPayload(target, amount) {
      target = target ? target.replace(/[^0-9]/g, '') : '';
      if (!target) return "";
      const targetType = target.length >= 15 ? '03' : target.length >= 13 ? '02' : '01';
      const formattedTarget = target.length >= 13 ? target : ("0000000000000" + target.replace(/^0/, "66")).slice(-13);
      let data = [
        "000201", "010211", "29370016A000000677010111", targetType, 
        formattedTarget.length.toString().padStart(2, '0'), formattedTarget, "5802TH", "5303764"
      ];
      if (amount > 0) {
        const amtStr = amount.toFixed(2);
        data.push("54" + amtStr.length.toString().padStart(2, '0') + amtStr);
      }
      data.push("6304");
      let payload = data.join("");
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function calculateSettlement(meals, friends, settledDebts) {
      const balances = {};
      friends.forEach(f => balances[f.id] = { ...f, totalPaid: 0, totalOwed: 0, net: 0 });

      let totalExpense = 0;
      meals.forEach(m => {
        totalExpense += m.finalAmount;
        if(balances[m.payerId]) {
          balances[m.payerId].totalPaid += m.finalAmount;
          balances[m.payerId].net += m.finalAmount;
        }
        m.participants.forEach(p => {
          if(balances[p.friendId]) {
            balances[p.friendId].totalOwed += p.amount;
            balances[p.friendId].net -= p.amount;
          }
        });
      });

      // หักลบรายการที่เคลียร์ไปแล้ว
      settledDebts.forEach(s => {
        if(balances[s.fromId] && balances[s.toId]) {
          balances[s.fromId].net += s.amount;
          balances[s.toId].net -= s.amount;
        }
      });

      let debtors = [], creditors = [];
      Object.values(balances).forEach(b => {
        b.net = Math.round(b.net * 100) / 100;
        if (b.net < -0.01) debtors.push({ ...b, amount: Math.abs(b.net) });
        else if (b.net > 0.01) creditors.push({ ...b, amount: b.net });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transfers = [];
      let d = 0, c = 0;
      while (d < debtors.length && c < creditors.length) {
        const debtor = debtors[d];
        const creditor = creditors[c];
        const minAmount = Math.min(debtor.amount, creditor.amount);
        if (minAmount > 0.01) {
          transfers.push({
            id: `tr_${debtor.id}_${creditor.id}_${Date.now()}`,
            fromId: debtor.id, fromName: debtor.name, fromColor: debtor.color,
            toId: creditor.id, toName: creditor.name, toColor: creditor.color,
            amount: minAmount, promptPay: creditor.promptPay,
            bankName: creditor.bankName, bankAccount: creditor.bankAccount
          });
        }
        debtor.amount -= minAmount;
        creditor.amount -= minAmount;
        if (debtor.amount <= 0.01) d++;
        if (creditor.amount <= 0.01) c++;
      }
      return { totalExpense, transfers, balances };
    }

    // ==========================================
    // 3. REUSABLE UI COMPONENTS
    // ==========================================
    const Icon = ({ name, className }) => <span className={`material-icons-round ${className}`}>{name}</span>;

    const Modal = ({ isOpen, onClose, title, children, fullWidth = false }) => {

    function PromptPayQR({ promptPay, amount }) {
      const [src, setSrc] = useState('');
      useEffect(() => {
        const payload = generatePromptPayPayload(promptPay, amount);
        if (payload) {
          QRCode.toDataURL(payload, { margin: 1, scale: 6, color: { dark: '#1e293b', light: '#ffffff' } }, (err, url) => {
            if (!err) setSrc(url);
          });
        }
      }, [promptPay, amount]);
      if (!src) return <div className="text-xs text-slate-500 bg-slate-50 p-6 rounded-xl text-center border border-slate-200 border-dashed w-32 h-32 flex items-center justify-center">ไม่มีพร้อมเพย์</div>;
      return <img src={src} alt="QR" className="w-32 h-32 mx-auto rounded-xl shadow-sm border border-slate-200 p-1" />;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('settle');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      
      const [friends, setFriends] = useState([]);
      const [meals, setMeals] = useState([]);
      const [settledDebts, setSettledDebts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const summaryRef = useRef(null);

      const [modals, setModals] = useState({ addMeal: false, addFriend: false, qr: false });
      const [selectedTransfer, setSelectedTransfer] = useState(null);

      useEffect(() => {
        const unsubFriends = db.collection('friends').orderBy('createdAt', 'asc').onSnapshot(snap => {
          setFriends(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubMeals = db.collection('meals').orderBy('date', 'desc').onSnapshot(snap => {
          setMeals(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setIsLoading(false);
        });
        const unsubSettled = db.collection('settled_debts').onSnapshot(snap => {
          setSettledDebts(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        return () => { unsubFriends(); unsubMeals(); unsubSettled(); };
      }, []);

      const openModal = (name, data = null) => {
        if(name === 'qr') setSelectedTransfer(data);
        setModals({ ...modals, [name]: true });
      };
      const closeModal = (name) => setModals({ ...modals, [name]: false });

      const handleAddFriend = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('name').trim();
        if (name) {
          const colors = ['bg-indigo-500','bg-emerald-500','bg-rose-500','bg-amber-500','bg-purple-500', 'bg-cyan-500'];
          const color = colors[friends.length % colors.length];
          await db.collection('friends').add({ 
            name, promptPay: formData.get('promptPay').trim(), 
            bankName: formData.get('bankName').trim(), bankAccount: formData.get('bankAccount').trim(), 
            color, createdAt: firebase.firestore.FieldValue.serverTimestamp() 
          });
          closeModal('addFriend');
        }
      };

      const handleAddMeal = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const title = formData.get('title').trim();
        const baseAmount = parseFloat(formData.get('amount'));
        const payerId = formData.get('payerId');
        const participantIds = formData.getAll('participants');
        
        if (title && baseAmount && payerId && participantIds.length > 0) {
          const hasVat = formData.get('hasVat') !== null;
          const hasSc = formData.get('hasServiceCharge') !== null;
          let finalAmount = baseAmount;
          if (hasSc) finalAmount += (finalAmount * 0.10);
          if (hasVat) finalAmount += (finalAmount * 0.07);
          const splitAmount = Math.round((finalAmount / participantIds.length) * 100) / 100;
          const participants = participantIds.map(id => ({ friendId: id, amount: splitAmount }));

          await db.collection('meals').add({
            title, date: formData.get('date'), categoryId: formData.get('category'), 
            baseAmount, finalAmount, hasVat, hasServiceCharge: hasSc, 
            payerId, participants, splitMode: 'equal',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          closeModal('addMeal');
        } else alert('กรุณากรอกข้อมูลให้ครบถ้วน');
      };

      const handleSettleDebt = async (transfer) => {
        if(confirm(`ยืนยันการเคลียร์ยอด ${transfer.amount} บาท ให้ ${transfer.toName}?`)) {
          await db.collection('settled_debts').add({
            fromId: transfer.fromId, toId: transfer.toId, amount: transfer.amount,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      };

      const exportToImage = async () => {
        if (summaryRef.current) {
          const canvas = await html2canvas(summaryRef.current, { scale: 2, backgroundColor: '#f8fafc' });
          const link = document.createElement('a');
          link.download = `MealSplit_Summary.png`;
          link.href = canvas.toDataURL();
          link.click();
        }
      };

      const shareToLine = () => {
        if (settleData.transfers.length === 0) return alert('เคลียร์ยอดครบแล้ว ไม่มีใครค้างเงิน');
        let text = `💸 สรุปยอดหารค่าอาหาร\nรวมทั้งหมด: ${settleData.totalExpense.toLocaleString()} บาท\n\n`;
        settleData.transfers.forEach(t => {
          text += `👉 ${t.fromName} โอนให้ ${t.toName}: ${t.amount.toLocaleString()} ฿\n`;
          if (t.promptPay) text += `   พร้อมเพย์: ${t.promptPay}\n`;
        });
        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
      };

      const settleData = useMemo(() => calculateSettlement(meals, friends, settledDebts), [meals, friends, settledDebts]);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold flex-col gap-4"><Icon name="sync" className="animate-spin text-4xl"/> กำลังโหลดข้อมูล...</div>;

      return (
        <>
          <div className="min-h-screen flex flex-col relative">
            {/* Header (Top Nav) */}
            <header className="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
                <div className="flex items-center gap-4">
                  <button onClick={() => setIsDrawerOpen(true)} className="p-2 rounded-xl border border-slate-200 text-slate-600 hover:text-indigo-600 hover:bg-slate-50 transition-all"><Icon name="menu" /></button>
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200"><Icon name="receipt_long"/></div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-lg font-bold text-slate-800">MealSplit</span>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200">ระบบหักลบหนี้</span>
                      </div>
                      <div className="text-xs text-slate-500 font-medium hidden sm:block">
                        {activeTab === 'settle' ? 'หักลบหนี้ & สรุปยอด' : activeTab === 'calendar' ? 'ปฏิทินรายวัน' : activeTab === 'meals' ? 'ประวัติรายการมื้อ' : 'กลุ่มเพื่อน & บัญชีรับเงิน'} 
                        • ยอดรวม {settleData.totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button className="hidden sm:flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl hover:bg-emerald-100 transition"><Icon name="table_view" className="text-[16px]"/> Google Sheets</button>
                  <button onClick={shareToLine} className="hidden sm:flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-slate-700 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition"><Icon name="share" className="text-[16px] text-[#06C755]"/> แชร์เข้า LINE</button>
                  <button onClick={() => openModal('addMeal')} className="flex items-center gap-1.5 px-4 py-2 text-xs font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-md transition"><Icon name="add" className="text-[16px]"/> ลงบันทึกมื้อใหม่</button>
                </div>
              </div>
            </header>

            {/* Sidebar Drawer */}
            {isDrawerOpen && (
              <div className="fixed inset-0 z-50 flex">
                <div className="fixed inset-0 modal-overlay transition-opacity" onClick={() => setIsDrawerOpen(false)}></div>
                <div className="relative w-full max-w-sm bg-white shadow-2xl flex flex-col animate-slide-in">
                  <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><Icon name="receipt_long" className="text-[18px]"/></div>
                      <div>
                        <h2 className="font-bold text-slate-800">MealSplit TH</h2>
                        <p className="text-xs text-slate-500">เมนูหลัก & การจัดการ</p>
                      </div>
                    </div>
                    <button onClick={() => setIsDrawerOpen(false)} className="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-700"><Icon name="close" className="text-[18px]"/></button>
                  </div>
                  <div className="p-4 space-y-1 overflow-y-auto flex-1">
                    <div className="text-[11px] font-bold text-slate-400 mb-2 px-3">เลือกมุมมอง</div>
                    
                    <button onClick={() => { setActiveTab('settle'); setIsDrawerOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left ${activeTab === 'settle' ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center shadow-sm ${activeTab === 'settle' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}><Icon name="balance" /></div>
                      <div><div className={`text-sm font-bold ${activeTab==='settle'?'text-indigo-700':'text-slate-700'}`}>หักลบหนี้ & สรุปยอด</div><div className="text-[11px] text-slate-400">ระบบคำนวณหักกลบลบหนี้อัตโนมัติ</div></div>
                    </button>

                    <button onClick={() => { setActiveTab('calendar'); setIsDrawerOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left ${activeTab === 'calendar' ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}`}>

                      <div>
                        <div className={`text-sm font-bold flex items-center gap-2 ${activeTab==='calendar'?'text-indigo-700':'text-slate-700'}`}>ปฏิทินรายวัน <span className="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded-md">{meals.length} มื้อ</span></div>
                        <div className="text-[11px] text-slate-400">ดูประวัติค่าอาหารตามวันที่ในปฏิทิน</div>
                      </div>
                    </button>

                    <button onClick={() => { setActiveTab('meals'); setIsDrawerOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left ${activeTab === 'meals' ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center shadow-sm ${activeTab === 'meals' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}><Icon name="receipt_long" /></div>
                      <div><div className={`text-sm font-bold ${activeTab==='meals'?'text-indigo-700':'text-slate-700'}`}>ประวัติรายการมื้อ</div><div className="text-[11px] text-slate-400">ค้นหา แก้ไข และจัดการบิลอาหารทั้งหมด</div></div>
                    </button>

                    <button onClick={() => { setActiveTab('friends'); setIsDrawerOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left ${activeTab === 'friends' ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center shadow-sm ${activeTab === 'friends' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}><Icon name="group" /></div>
                      <div><div className={`text-sm font-bold ${activeTab==='friends'?'text-indigo-700':'text-slate-700'}`}>กลุ่มเพื่อน & บัญชีรับเงิน</div><div className="text-[11px] text-slate-400">จัดการรายชื่อ พร้อมเบอร์พร้อมเพย์/บัญชี</div></div>
                    </button>

                  </div>
                </div>
              </div>
            )}

            {/* Main Content */}
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 pb-20">
              {activeTab === 'settle' && (
                <div ref={summaryRef}>
                  <SettlementView 
                    settlementData={settleData} 
                    meals={meals} 
                    friends={friends} 
                    onSettleDebt={handleSettleDebt} 
                    onOpenQR={(data) => openModal('qr', data)} 
                    exportToImage={exportToImage} 
                    shareToLine={shareToLine} 
                  />
                </div>
              )}
              {activeTab === 'calendar' && <CalendarView meals={meals} />}
              {activeTab === 'meals' && <MealsView meals={meals} friends={friends} onDeleteMeal={(id) => db.collection('meals').doc(id).delete()} />}
              {activeTab === 'friends' && <FriendsView friends={friends} onOpenAddFriend={() => openModal('addFriend')} onDeleteFriend={(id) => db.collection('friends').doc(id).delete()} />}
            </main>

            <footer className="mt-auto py-5 border-t border-slate-200 bg-white text-slate-400 text-xs text-center">
              MealSplit TH — ระบบหารค่าข้าว & หักลบหนี้อัตโนมัติ
            </footer>
          </div>

          {/* ================= MODALS ================= */}

          {/* Add Meal Modal (จัดเต็ม) */}
          <Modal isOpen={modals.addMeal} onClose={() => closeModal('addMeal')} title="บันทึกมื้ออาหารใหม่" fullWidth={true}>
            <form onSubmit={handleAddMeal} className="bg-slate-50 p-5 rounded-b-2xl space-y-5">
              <div className="space-y-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อร้าน / มื้ออาหาร <span className="text-slate-400 font-normal">(ไม่ระบุก็ได้)</span></label>
                  <input name="title" placeholder="เช่น ข้าวมันไก่, ชาบู หรือระบุยอดอย่างเดียวได้เลย" className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 text-sm bg-slate-50" required />
                </div>
                <div className="flex gap-3">
                  <div className="w-1/2">
                    <label className="text-xs font-bold text-slate-700 mb-1.5 block">วันที่</label>
                    <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm text-slate-600 bg-slate-50" required />
                  </div>
                  <div className="w-1/2">
                    <label className="text-xs font-bold text-slate-700 mb-1.5 block">หมวดหมู่</label>
                    <select name="category" className="w-full p-3 rounded-xl border border-slate-200 outline-none bg-slate-50 focus:border-indigo-500 text-sm">
                      {DEFAULT_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                    </select>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3 items-end">
                  <div>
                    <label className="text-xs font-bold text-rose-500 mb-1.5 block">ยอดเงินรวม (บาท) *</label>
                    <input name="amount" type="number" step="0.01" placeholder="0.00" className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-mono font-bold text-lg text-slate-800" required />
                  </div>
                  <div className="flex items-center gap-4 h-12 px-2 text-xs font-semibold text-slate-600">
                    <label className="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="hasServiceCharge" className="w-4 h-4 text-indigo-600 rounded" /> + Service 10%</label>
                    <label className="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="hasVat" className="w-4 h-4 text-indigo-600 rounded" /> + VAT 7%</label>
                  </div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2"><Icon name="payments" className="text-emerald-600"/> ใครเป็นคนสำรองจ่ายเงิน?</p>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {friends.map(f => (
                    <label key={f.id} className="cursor-pointer">
                      <input type="radio" name="payerId" value={f.id} className="peer sr-only" required />
                      <div className="p-3 rounded-xl border border-slate-200 bg-white flex items-center gap-2 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:ring-1 peer-checked:ring-indigo-600 transition">
                        <div className={`w-6 h-6 rounded-md text-white font-bold flex items-center justify-center text-xs ${f.color || 'bg-slate-500'}`}>{f.name.charAt(0)}</div>
                        <span className="text-xs font-bold text-slate-700 truncate">{f.name}</span>
                      </div>
                    </label>
                  ))}
                  {friends.length === 0 && <p className="text-xs text-rose-500 col-span-full">กรุณาเพิ่มเพื่อนในแท็บ 'เพื่อน' ก่อน</p>}
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2"><Icon name="restaurant" className="text-amber-500"/> ใครร่วมกินบ้าง? (หารเท่ากัน)</p>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {friends.map(f => (
                    <label key={f.id} className="cursor-pointer">
                      <input type="checkbox" name="participants" value={f.id} className="peer sr-only" defaultChecked />
                      <div className="p-3 rounded-xl border border-slate-200 bg-white flex items-center gap-2 peer-checked:bg-indigo-50 peer-checked:border-indigo-500 transition opacity-60 peer-checked:opacity-100">
                        <div className="w-4 h-4 rounded border border-slate-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 flex items-center justify-center">
                          <Icon name="check" className="text-white text-[12px] opacity-0 peer-checked:opacity-100" />
                        </div>
                        <span className="text-xs font-bold text-slate-700 truncate">{f.name}</span>
                      </div>
                    </label>
                  ))}
                </div>
              </div>
              
              <div className="flex gap-3 pt-2">
                <button type="button" onClick={() => closeModal('addMeal')} className="w-1/3 bg-white border border-slate-300 text-slate-700 font-bold py-3.5 rounded-xl text-sm hover:bg-slate-50 transition">ยกเลิก</button>
                <button disabled={friends.length === 0} type="submit" className="w-2/3 bg-indigo-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-md hover:bg-indigo-700 transition disabled:opacity-50 flex items-center justify-center gap-2">
                  <Icon name="check_circle" className="text-[18px]"/> บันทึกบิลนี้
                </button>
              </div>
            </form>
          </Modal>

          {/* Add Friend Modal */}
          <Modal isOpen={modals.addFriend} onClose={() => closeModal('addFriend')} title="เพิ่มรายชื่อเพื่อน & บัญชีรับเงิน">
            <form onSubmit={handleAddFriend} className="space-y-4 p-2">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อเพื่อน / ชื่อเล่น *</label>
                <input name="name" placeholder="ระบุชื่อเรียกในกลุ่ม" className="w-full p-3 rounded-xl border border-slate-300 text-sm outline-none focus:border-indigo-500 focus:ring-1" required />
              </div>
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">เบอร์พร้อมเพย์</label>
                <input name="promptPay" placeholder="08X-XXX-XXXX" className="w-full p-3 rounded-xl border border-slate-300 text-sm outline-none focus:border-indigo-500 font-mono" />
              </div>
              <div className="flex gap-3">
                <div className="w-1/2">
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">ชื่อธนาคาร</label>
                  <input name="bankName" placeholder="เช่น กสิกรไทย" className="w-full p-3 rounded-xl border border-slate-300 text-sm outline-none focus:border-indigo-500" />
                </div>
                <div className="w-1/2">
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">เลขบัญชี</label>
                  <input name="bankAccount" placeholder="เลข 10 หลัก" className="w-full p-3 rounded-xl border border-slate-300 text-sm outline-none focus:border-indigo-500 font-mono" />
                </div>
              </div>
              <button type="submit" className="w-full mt-4 bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-md hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                <Icon name="person_add" className="text-[18px]"/> บันทึกเพื่อนใหม่
              </button>
            </form>
          </Modal>

          {/* QR Modal */}
          <Modal isOpen={modals.qr} onClose={() => closeModal('qr')} title="สแกนเพื่อจ่ายเงิน">
            {selectedTransfer && (
              <div className="text-center space-y-5 p-2">
                <div className="flex items-center justify-center gap-3 text-sm font-bold">
                  <span className="text-rose-600">{selectedTransfer.fromName}</span>
                  <span className="text-slate-300 text-lg">➔</span>
                  <span className="text-emerald-600">{selectedTransfer.toName}</span>
                </div>
                <div className="bg-rose-50 text-rose-700 p-4 rounded-2xl border border-rose-200">
                  <p className="text-xs font-bold uppercase tracking-wider mb-1">ยอดโอนสุทธิ</p>
                  <h3 className="text-4xl font-mono font-extrabold">{selectedTransfer.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})} ฿</h3>
                </div>
                <div className="bg-blue-50/50 p-6 rounded-3xl border border-blue-100 flex flex-col items-center">
                  <p className="text-xs font-bold text-blue-900 mb-4 flex items-center gap-1.5"><Icon name="qr_code_scanner" className="text-[18px]"/> สแกน QR ผ่านแอปธนาคาร</p>
                  <PromptPayQR promptPay={selectedTransfer.promptPay} amount={selectedTransfer.amount} />
                  <div className="mt-5 w-full space-y-2">
                    {selectedTransfer.promptPay && (
                      <button onClick={() => { navigator.clipboard.writeText(selectedTransfer.promptPay); alert('คัดลอกพร้อมเพย์แล้ว'); }} className="w-full text-xs text-blue-700 font-bold bg-white border border-blue-200 px-4 py-3 rounded-xl hover:bg-blue-100 transition shadow-sm font-mono flex justify-center items-center gap-2">
                        <Icon name="content_copy" className="text-[16px]"/> พร้อมเพย์: {selectedTransfer.promptPay}
                      </button>
                    )}
                    {selectedTransfer.bankAccount && (
                      <button onClick={() => { navigator.clipboard.writeText(selectedTransfer.bankAccount); alert('คัดลอกเลขบัญชีแล้ว'); }} className="w-full text-[11px] text-slate-700 font-bold bg-white border border-slate-200 px-4 py-3 rounded-xl hover:bg-slate-100 transition shadow-sm font-mono flex justify-center items-center gap-2">
                        <Icon name="content_copy" className="text-[16px]"/> {selectedTransfer.bankName}: {selectedTransfer.bankAccount}
                      </button>
                    )}
                  </div>
                </div>
                <button onClick={() => { handleSettleDebt(selectedTransfer); closeModal('qr'); }} className="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                  <Icon name="check_circle" className="text-[18px]"/> มาร์คว่าโอนเรียบร้อยแล้ว
                </button>
              </div>
            )}
          </Modal>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
